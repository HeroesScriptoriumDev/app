 Among the Nations","desc":"Though captured, the Ark demonstrates God's absolute sovereignty over the Philistine gods.","cat":"Worship","tl":"Samuel","primary":"1 Samuel 5–6","supp":["Isaiah 45:22–23","Philippians 2:9–11","Psalm 96"],"collect":"Almighty Lord, all nations belong to You. May every knee bow before Christ in worship. Amen.","verse":"1 Samuel 5:7","cc":[{"t":"Catholic","ref":"CCC §§2095–2097","q":"Why worship God alone?"},{"t":"Anglican","ref":"ACNA Q98","q":"Why worship only God?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q94","q":"What does God require?"},{"t":"Westminster","ref":"Q46","q":"What is the First Commandment?"},{"t":"Baptist","ref":"Q50","q":"Why worship God alone?"}],"christ":"The fall of Dagon anticipates Christ's complete victory over every false god and power.","comp":"Every Christian tradition proclaims Christ as Lord over every nation and authority.","observe":"Why did Dagon fall?","interpret":"What does God's victory teach?","apply":"Are there modern idols competing for my devotion?","pray":"Praise Christ as King over all.","why":"Shows God's sovereignty even outside Israel.","notes":"The Philistine god Dagon repeatedly falls before the Ark of the Covenant."},{"m":4,"d":29,"name":"Ebenezer","theme":"Remember the Lord's Help","desc":"Samuel leads Israel to repentance, and God grants victory. Samuel erects the stone called Ebenezer: \"Thus far the Lord has helped us.\"","cat":"Thanksgiving","tl":"Samuel","primary":"1 Samuel 7","supp":["Psalm 121","Lamentations 3:22–23","Psalm 124"],"collect":"Faithful Lord, thank You for Your help throughout every season of my life. Continue to lead me by Your grace. Amen.","verse":"1 Samuel 7:12","cc":[{"t":"Catholic","ref":"CCC §§2637–2638","q":"Why do Christians give thanks?"},{"t":"Anglican","ref":"ACNA Q141","q":"Why should Christians thank God?"},{"t":"Lutheran","ref":"First Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q27","q":"What is God's providence?"},{"t":"Westminster","ref":"Q1","q":"What is our only comfort?"},{"t":"Baptist","ref":"Q11","q":"Why trust God?"}],"christ":"Christ remains our eternal Helper and Defender, whose faithfulness never fails.","comp":"Every Christian tradition encourages remembering God's past faithfulness to strengthen present faith.","observe":"Why build a memorial?","interpret":"What blessings has God already given?","apply":"How can I remember God's faithfulness?","pray":"Thank God for His help throughout your life.","why":"Samuel's leadership brings national repentance.","notes":"Ebenezer means \"Stone of Help\" and became a lasting symbol of God's faithfulness."},{"m":4,"d":30,"name":"Faithful Leadership","theme":"Preparing for a King","desc":"Samuel faithfully judges Israel, but the people's future request for a king reveals both their desire for security and God's greater plan for redemption.","cat":"Leadership","tl":"Samuel","primary":"1 Samuel 8","supp":["John 18:36–37","Revelation 19:16","Psalm 2"],"collect":"Sovereign King, teach me to trust Your rule above every earthly authority. Through Jesus Christ, the King of kings. Amen.","verse":"1 Samuel 8:7","cc":[{"t":"Catholic","ref":"CCC §§436–440","q":"Why is Christ the true King?"},{"t":"Anglican","ref":"ACNA Q112","q":"What offices does Christ fulfill?"},{"t":"Lutheran","ref":"Apostles' Creed","q":"What has Christ done?"},{"t":"Heidelberg","ref":"Q31","q":"Why is Christ our King?"},{"t":"Westminster","ref":"Q26","q":"How does Christ execute the office of a King?"},{"t":"Baptist","ref":"Q31","q":"Why is Jesus our King?"}],"christ":"Israel desired an earthly king, but God was preparing the way for David—and ultimately for Jesus Christ, the eternal King.","comp":"Every Christian tradition proclaims Christ as the ultimate King whose kingdom will never end.","observe":"Why did Israel want a king?","interpret":"What kind of King is Jesus?","apply":"Am I trusting earthly security more than God's reign?","pray":"Submit every area of your life to Christ's kingship.","why":"Concludes April by preparing for the rise of Israel's monarchy.","notes":"Samuel's warning about kingship sets the stage for Saul, David, and the Davidic Covenant that points to Christ."},{"m":5,"d":1,"name":"Israel Demands a King","theme":"Trusting Earthly Power","desc":"Israel asks for a king like the surrounding nations, revealing a desire to trust human leadership rather than God's direct rule.","cat":"Scripture Study","tl":"United Monarchy","primary":"1 Samuel 8","supp":["Deuteronomy 17:14–20","John 18:36–37","Psalm 146"],"collect":"Sovereign Lord, teach me to trust in Your perfect reign above every earthly power. Through Jesus Christ, the King of kings. Amen.","verse":"1 Samuel 8:7","cc":[{"t":"Catholic","ref":"CCC §§436–440","q":"Why is Christ our King?"},{"t":"Anglican","ref":"ACNA Q112","q":"What offices does Christ fulfill?"},{"t":"Lutheran","ref":"Apostles' Creed—Second Article","q":"What has Christ done?"},{"t":"Heidelberg","ref":"Q31","q":"Why is Christ our King?"},{"t":"Westminster","ref":"Q26","q":"How does Christ execute the office of King?"},{"t":"Baptist","ref":"Q31","q":"Why is Jesus the eternal King?"}],"christ":"Israel desired an earthly king, but God was preparing the way for David and ultimately Christ, whose kingdom has no end.","comp":"Every Christian tradition proclaims Christ as the true King over His Church.","observe":"Why did Israel want a king?","interpret":"What were they trusting?","apply":"Where do I seek security apart from God?","pray":"Pray for a heart that trusts God's rule.","why":"Begins Israel's monarchy.","notes":"Israel's request itself was not sinful, but their motivation revealed misplaced trust."},{"m":5,"d":2,"name":"Saul Anointed","theme":"God's Choice and Human Expectation","desc":"Samuel anoints Saul as Israel's first king. Outwardly impressive, Saul begins with humility but will soon reveal the condition of his heart.","cat":"Character Study","tl":"United Monarchy","primary":"1 Samuel 9–10","supp":["Romans 13:1","Proverbs 21:1","Psalm 75"],"collect":"Lord, remind me that true greatness comes through humble obedience rather than outward appearance. Amen.","verse":"1 Samuel 10:1","cc":[{"t":"Catholic","ref":"CCC §§1897–1904","q":"Where does authority come from?"},{"t":"Anglican","ref":"ACNA Q169","q":"Why does God establish authority?"},{"t":"Lutheran","ref":"Fourth Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q104","q":"What does God require concerning authority?"},{"t":"Westminster","ref":"Q124","q":"What does the Fifth Commandment teach?"},{"t":"Baptist","ref":"Q66","q":"Why has God established authority?"}],"christ":"Saul's anointing anticipates Christ, the truly Anointed King who perfectly fulfills God's will.","comp":"Every Christian tradition teaches that leaders are accountable to God.","observe":"Why was Saul chosen?","interpret":"What qualities did people notice?","apply":"How should I view leadership?","pray":"Pray for leaders to seek God's wisdom.","why":"Introduces Israel's first king.","notes":"Messiah and \"Christ\" both mean \"Anointed One.\""},{"m":5,"d":3,"name":"A Humble Beginning","theme":"God Equips Those He Calls","desc":"Saul initially demonstrates humility and receives God's Spirit for the task before him.","cat":"Christian Living","tl":"United Monarchy","primary":"1 Samuel 10–11","supp":["Philippians 2:1–11","James 4:6","Psalm 25"],"collect":"Father, keep me humble as You use me in Your service. Amen.","verse":"1 Samuel 11:13","cc":[{"t":"Catholic","ref":"CCC §§1833–1845","q":"What virtues should Christians pursue?"},{"t":"Anglican","ref":"ACNA Q104","q":"What is humility?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q86","q":"Why do good works?"},{"t":"Westminster","ref":"Q91","q":"What is sanctification?"},{"t":"Baptist","ref":"Q90","q":"How should Christians live?"}],"christ":"Christ demonstrates perfect humility while exercising perfect authority.","comp":"Every tradition teaches humility as an essential Christian virtue.","observe":"Why was Saul successful early on?","interpret":"How does humility prepare us for service?","apply":"How can I grow in humility?","pray":"Thank God for every opportunity to serve.","why":"Shows Saul's promising beginning.","notes":"Saul's early reign united Israel against outside threats."},{"m":5,"d":4,"name":"Saul's Disobedience","theme":"Obedience Over Ritual","desc":"Saul disobeys God's command by offering sacrifice himself instead of waiting for Samuel.","cat":"Doctrine","tl":"United Monarchy","primary":"1 Samuel 13","supp":["Hebrews 11:6","James 1:22","Psalm 40"],"collect":"Lord, teach me to obey Your commands completely rather than relying upon my own understanding. Amen.","verse":"1 Samuel 13:13","cc":[{"t":"Catholic","ref":"CCC §§144–149","q":"What is obedience of faith?"},{"t":"Anglican","ref":"ACNA Q98","q":"What is faith?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q86","q":"What is true faith?"},{"t":"Westminster","ref":"Q39","q":"What does God require?"},{"t":"Baptist","ref":"Q36","q":"What is saving faith?"}],"christ":"Christ obeyed the Father perfectly in every circumstance.","comp":"Every Christian tradition teaches that genuine faith produces obedience.","observe":"Why did Saul disobey?","interpret":"What happens when fear replaces trust?","apply":"Where am I tempted to take matters into my own hands?","pray":"Pray for patient obedience.","why":"Marks the beginning of Saul's spiritual decline.","notes":"Saul's impatience had lasting consequences for his dynasty."},{"m":5,"d":5,"name":"Jonathan's Faith","theme":"Courageous Trust","desc":"Jonathan trusts God completely, believing that victory depends upon the Lord rather than numbers.","cat":"Faith","tl":"United Monarchy","primary":"1 Samuel 14","supp":["Romans 8:31","Hebrews 11:32–34","Psalm 27"],"collect":"Almighty God, strengthen my faith to trust You even when circumstances seem impossible. Amen.","verse":"1 Samuel 14:6","cc":[{"t":"Catholic","ref":"CCC §§1814–1816","q":"What is faith?"},{"t":"Anglican","ref":"ACNA Q98","q":"What is saving faith?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q21","q":"What is true faith?"},{"t":"Westminster","ref":"Q86","q":"What is faith?"},{"t":"Baptist","ref":"Q36","q":"What is saving faith?"}],"christ":"Jonathan's confidence foreshadows the complete trust Christ demonstrated in the Father's will.","comp":"Every Christian tradition teaches courageous faith rooted in God's promises.","observe":"Why was Jonathan confident?","interpret":"What does true faith look like?","apply":"Where is God asking me to trust Him?","pray":"Ask God for bold faith.","why":"Contrasts Jonathan's faith with Saul's fear.","notes":"Jonathan remains one of Scripture's greatest examples of courageous trust."},{"m":5,"d":6,"name":"To Obey Is Better","theme":"The Heart of Worship","desc":"Saul spares what God commanded him to destroy and attempts to justify his actions with religious excuses. Samuel reminds him that obedience is better than sacrifice.","cat":"Doctrine","tl":"United Monarchy","primary":"1 Samuel 15","supp":["Hosea 6:6","Matthew 9:13","Psalm 51"],"collect":"Holy God, give me a heart that delights in obeying You rather than merely appearing religious. Amen.","verse":"1 Samuel 15:22","cc":[{"t":"Catholic","ref":"CCC §§2052–2055","q":"Why does God give His commandments?"},{"t":"Anglican","ref":"ACNA Q298","q":"What do the Commandments teach?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q39","q":"Why did God give His Law?"},{"t":"Westminster","ref":"Q91","q":"What are good works?"},{"t":"Baptist","ref":"Q90","q":"How should Christians live?"}],"christ":"Jesus fulfills perfect obedience and calls His followers to love-driven obedience.","comp":"Every Christian tradition teaches that outward religion without obedience displeases God.","observe":"Why wasn't Saul's sacrifice enough?","interpret":"What does God desire most?","apply":"Is my worship matched by obedience?","pray":"Pray for an obedient heart.","why":"Culminates Saul's rejection as king.","notes":"This verse became one of the defining theological statements of the Old Testament."},{"m":5,"d":7,"name":"A Heart After God","theme":"God's Choice","desc":"God sends Samuel to Bethlehem to anoint David, teaching that God looks upon the heart rather than outward appearance.","cat":"Character Study","tl":"United Monarchy","primary":"1 Samuel 16","supp":["Acts 13:22","John 7:24","Psalm 78"],"collect":"Lord, shape my heart according to Your will, and help me seek the character that pleases You above outward success. Amen.","verse":"1 Samuel 16:7","cc":[{"t":"Catholic","ref":"CCC §§368–378","q":"What matters most before God?"},{"t":"Anglican","ref":"ACNA Q104","q":"What is holiness?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q86","q":"What is true faith?"},{"t":"Westminster","ref":"Q91","q":"What pleases God?"},{"t":"Baptist","ref":"Q90","q":"How should Christians live?"}],"christ":"David points forward to Jesus Christ, the greater Son of David and the perfect King after God's own heart.","comp":"Every Christian tradition recognizes David as a foreshadowing of the Messiah.","observe":"Why did God reject appearances?","interpret":"What does God see that people cannot?","apply":"How can I cultivate a heart devoted to God?","pray":"Ask God to transform your heart daily.","why":"Introduces Israel's greatest earthly king.","notes":"David was likely a teenager when Samuel anointed him in Bethlehem."},{"m":5,"d":8,"name":"David the Shepherd","theme":"Faithfulness in Small Things","desc":"Before leading a nation, David faithfully shepherds his father's sheep, demonstrating that God prepares leaders through ordinary responsibilities.","cat":"Character Study","tl":"United Monarchy","primary":"1 Samuel 16:14–23","supp":["Luke 16:10","Psalm 78:70–72","Colossians 3:23–24"],"collect":"Faithful Father, help me honor You in the small responsibilities You have entrusted to me today. Through Jesus Christ our Lord. Amen.","verse":"Luke 16:10","cc":[{"t":"Catholic","ref":"CCC §§901–913","q":"Why is faithful service important?"},{"t":"Anglican","ref":"ACNA Q104","q":"How should Christians serve God?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q86","q":"Why do good works?"},{"t":"Westminster","ref":"Q91","q":"What pleases God?"},{"t":"Baptist","ref":"Q90","q":"How should Christians live?"}],"christ":"David's faithful shepherding foreshadows Christ, the Good Shepherd who lovingly cares for His flock.","comp":"Every Christian tradition teaches that faithfulness in ordinary life prepares believers for greater service.","observe":"Why did God prepare David as a shepherd?","interpret":"What does faithfulness in small things reveal?","apply":"What ordinary tasks can I do faithfully today?","pray":"Pray for diligence in daily responsibilities.","why":"God often prepares His servants long before others recognize them.","notes":"Shepherding was a humble occupation but became one of Scripture's richest images of godly leadership."},{"m":5,"d":9,"name":"David and Goliath","theme":"Faith Over Fear","desc":"David confronts Goliath with confidence in the Lord, demonstrating that true victory comes through faith rather than human strength.","cat":"Faith","tl":"United Monarchy","primary":"1 Samuel 17","supp":["Hebrews 11:32–34","Ephesians 6:10–18","Psalm 27"],"collect":"Almighty God, strengthen my faith to face every challenge with confidence in Your power rather than my own abilities. Amen.","verse":"1 Samuel 17:47","cc":[{"t":"Catholic","ref":"CCC §§1814–1816","q":"What is faith?"},{"t":"Anglican","ref":"ACNA Q98–103","q":"What is saving faith?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q21","q":"What is true faith?"},{"t":"Westminster","ref":"Q86","q":"What is faith?"},{"t":"Baptist","ref":"Q36","q":"What is saving faith?"}],"christ":"David points to Christ, who defeats humanity's greatest enemies—sin, death, and Satan—through His perfect victory.","comp":"Every Christian tradition recognizes David's victory as a picture of trusting God's power.","observe":"Why was David confident?","interpret":"What made his faith different from Saul's?","apply":"What \"giants\" require faith today?","pray":"Pray for courage rooted in God's promises.","why":"One of Scripture's best-known demonstrations of faith.","notes":"David likely fought Goliath while still a young shepherd."},{"m":5,"d":10,"name":"A Covenant Friendship","theme":"Faithful Companionship","desc":"Jonathan recognizes God's calling upon David and forms a covenant friendship marked by humility, loyalty, and sacrificial love.","cat":"Christian Living","tl":"United Monarchy","primary":"1 Samuel 18:1–5","supp":["John 15:12–15","Proverbs 17:17","Psalm 133"],"collect":"Lord, help me cultivate friendships marked by faithfulness, humility, and love that honor You. Amen.","verse":"Proverbs 17:17","cc":[{"t":"Catholic","ref":"CCC §§1939–1942","q":"Why should Christians love one another?"},{"t":"Anglican","ref":"ACNA Q104","q":"How should Christians treat one another?"},{"t":"Lutheran","ref":"Fifth Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q107","q":"What does God require concerning our neighbor?"},{"t":"Westminster","ref":"Q135","q":"What duties do we owe others?"},{"t":"Baptist","ref":"Q74","q":"Why love our neighbor?"}],"christ":"Jonathan's selfless friendship reflects Christ, who calls His disciples friends and lays down His life for them.","comp":"Every Christian tradition values faithful Christian friendship and mutual encouragement.","observe":"Why did Jonathan support David?","interpret":"What makes friendship biblical?","apply":"How can I be a faithful friend?","pray":"Thank God for those who encourage your faith.","why":"Introduces one of Scripture's greatest friendships.","notes":"Jonathan willingly placed God's plan above his own claim to the throne."},{"m":5,"d":11,"name":"Saul's Jealousy","theme":"The Danger of Envy","desc":"Saul becomes consumed by jealousy as David's success grows, allowing envy to poison his heart and judgment.","cat":"Wisdom","tl":"United Monarchy","primary":"1 Samuel 18:6–30","supp":["James 3:13–18","Galatians 5:19–26","Psalm 37"],"collect":"Merciful Father, guard my heart from jealousy and help me rejoice in the blessings You give to others. Amen.","verse":"James 3:16","cc":[{"t":"Catholic","ref":"CCC §§2538–2540","q":"Why is envy sinful?"},{"t":"Anglican","ref":"ACNA Q74–79","q":"What is sin?"},{"t":"Lutheran","ref":"Ninth & Tenth Commandments","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q148","q":"What sins arise from envy?"},{"t":"Westminster","ref":"Q81","q":"Why avoid sinful desires?"},{"t":"Baptist","ref":"Q81","q":"What does God require regarding contentment?"}],"christ":"Christ perfectly rejoices in the Father's will and teaches His followers to love rather than envy.","comp":"Every Christian tradition warns that envy destroys both relationships and spiritual health.","observe":"Why did Saul become jealous?","interpret":"What does envy reveal about the heart?","apply":"How can I cultivate contentment?","pray":"Pray for joy in God's gifts to others.","why":"Marks the beginning of Saul's long pursuit of David.","notes":"Saul's jealousy gradually transformed admiration into hatred."},{"m":5,"d":12,"name":"Escaping the Spear","theme":"Trust Under Pressure","desc":"David repeatedly escapes Saul's attempts on his life, learning to trust God's protection rather than taking revenge.","cat":"Christian Living","tl":"United Monarchy","primary":"1 Samuel 19","supp":["Romans 12:17–21","Psalm 59","Matthew 5:44"],"collect":"Lord, help me trust Your justice rather than seeking revenge when I am treated unfairly. Amen.","verse":"Psalm 59:16","cc":[{"t":"Catholic","ref":"CCC §§2302–2303","q":"Why must Christians reject vengeance?"},{"t":"Anglican","ref":"ACNA Q104","q":"How should Christians respond to enemies?"},{"t":"Lutheran","ref":"Fifth Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q107","q":"What does God require concerning anger?"},{"t":"Westminster","ref":"Q136","q":"What sins are forbidden?"},{"t":"Baptist","ref":"Q75","q":"Why forgive others?"}],"christ":"Christ entrusted Himself to the Father's justice and forgave His enemies from the Cross.","comp":"Every Christian tradition teaches forgiveness while trusting God for justice.","observe":"Why didn't David retaliate?","interpret":"What does trusting God look like during persecution?","apply":"Who do I need to forgive?","pray":"Pray for those who oppose you.","why":"David begins learning patience before becoming king.","notes":"David's years of fleeing Saul shaped his future leadership."},{"m":5,"d":13,"name":"Jonathan's Loyalty","theme":"Choosing God's Will","desc":"Jonathan chooses God's purposes over personal ambition, remaining loyal to David despite the cost.","cat":"Character Study","tl":"United Monarchy","primary":"1 Samuel 20","supp":["Philippians 2:3–4","Romans 12:10","Psalm 15"],"collect":"Father, teach me to place Your will above my own ambitions and faithfully serve others. Amen.","verse":"1 Samuel 20:42","cc":[{"t":"Catholic","ref":"CCC §§1822–1829","q":"What is Christian charity?"},{"t":"Anglican","ref":"ACNA Q104","q":"What is Christian love?"},{"t":"Lutheran","ref":"Fifth Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q107","q":"What does love require?"},{"t":"Westminster","ref":"Q135","q":"What duties do we owe others?"},{"t":"Baptist","ref":"Q74","q":"Why love sacrificially?"}],"christ":"Jonathan reflects Christ's self-giving love by placing God's purposes before his own interests.","comp":"Every Christian tradition encourages sacrificial love rooted in humility.","observe":"Why did Jonathan support David?","interpret":"What sacrifices does love require?","apply":"How can I put others before myself?","pray":"Pray for a servant's heart.","why":"Jonathan's covenant with David remains steadfast despite growing danger.","notes":"Jonathan willingly surrendered what many would have considered his rightful inheritance."},{"m":5,"d":14,"name":"The Bread of Presence","theme":"Mercy Above Ritual","desc":"David receives the consecrated bread from Ahimelech, illustrating that God's mercy is greater than rigid legalism.","cat":"Doctrine","tl":"United Monarchy","primary":"1 Samuel 21","supp":["Matthew 12:1–8","Hosea 6:6","Psalm 145"],"collect":"Merciful God, teach me to reflect Your compassion while honoring Your truth. Through Jesus Christ our Lord. Amen.","verse":"Hosea 6:6","cc":[{"t":"Catholic","ref":"CCC §§2055–2063","q":"What is the purpose of God's Law?"},{"t":"Anglican","ref":"ACNA Q298","q":"What do the Commandments teach?"},{"t":"Lutheran","ref":"Third Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q91","q":"What pleases God?"},{"t":"Westminster","ref":"Q97","q":"How should God's Law be understood?"},{"t":"Baptist","ref":"Q90","q":"Why did God give His Law?"}],"christ":"Jesus cites this event to reveal that He is Lord of the Sabbath and the fulfillment of the Law.","comp":"Every Christian tradition teaches that God's Law is fulfilled in Christ and understood through mercy and truth.","observe":"Why was David given the holy bread?","interpret":"What does Jesus teach from this event?","apply":"How can I balance truth and mercy?","pray":"Ask God for wisdom and compassion.","why":"Begins David's years as a fugitive.","notes":"Jesus later refers to this event in defending His disciples' actions on the Sabbath (Matthew 12)."},{"m":5,"d":15,"name":"David at Adullam","theme":"God Forms a Kingdom","desc":"David gathers those who are distressed, indebted, and discouraged, and God begins forming a faithful community around His chosen king.","cat":"Christian Living","tl":"United Monarchy","primary":"1 Samuel 22:1–5","supp":["Matthew 11:28–30","Acts 2:42–47","Psalm 34"],"collect":"Lord Jesus, gather Your people together in unity and teach us to encourage one another in faith. Amen.","verse":"Psalm 34:8","cc":[{"t":"Catholic","ref":"CCC §§781–786","q":"What is the People of God?"},{"t":"Anglican","ref":"ACNA Q97","q":"What is the Church?"},{"t":"Lutheran","ref":"Third Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q54","q":"What is the Church?"},{"t":"Westminster","ref":"Q65","q":"What is the visible Church?"},{"t":"Baptist","ref":"Q95","q":"What is the Church?"}],"christ":"Just as David gathered the outcast, Christ gathers sinners into His Kingdom and transforms them into His people.","comp":"Every Christian tradition teaches that Christ calls ordinary people into His Church.","observe":"Who came to David?","interpret":"Why would God build His kingdom this way?","apply":"How can I encourage fellow believers?","pray":"Pray for unity in Christ's Church.","why":"David begins leading before becoming king.","notes":"Many of David's future mighty men first joined him in the cave of Adullam."},{"m":5,"d":16,"name":"Doeg's Betrayal","theme":"The Cost of Evil","desc":"Saul orders the slaughter of the priests at Nob through Doeg's treachery, revealing the devastating effects of unchecked wickedness.","cat":"Wisdom","tl":"United Monarchy","primary":"1 Samuel 22:6–23","supp":["Romans 12:19","James 3:13–18","Psalm 52"],"collect":"Righteous Judge, keep me from evil and strengthen me to stand for truth even when it is costly. Amen.","verse":"Psalm 52:8","cc":[{"t":"Catholic","ref":"CCC §§1865–1869","q":"How does sin affect others?"},{"t":"Anglican","ref":"ACNA Q74","q":"What is sin?"},{"t":"Lutheran","ref":"Fifth Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q105","q":"What does God require?"},{"t":"Westminster","ref":"Q135","q":"What duties do we owe our neighbor?"},{"t":"Baptist","ref":"Q76","q":"Why reject evil?"}],"christ":"Christ remained faithful despite betrayal and injustice, entrusting judgment to the Father.","comp":"Every Christian tradition teaches that evil ultimately destroys both individuals and communities.","observe":"Why did Doeg act as he did?","interpret":"What are the consequences of evil?","apply":"How can I remain faithful under pressure?","pray":"Pray for courage to do what is right.","why":"Demonstrates Saul's moral decline.","notes":"The massacre at Nob marks one of Saul's darkest acts as king."},{"m":5,"d":17,"name":"Saving Keilah","theme":"Serving Without Recognition","desc":"David risks his own safety to rescue the city of Keilah, even though its people later consider betraying him.","cat":"Service","tl":"United Monarchy","primary":"1 Samuel 23:1–14","supp":["Luke 6:35","Galatians 6:9–10","Psalm 31"],"collect":"Lord, help me serve faithfully without seeking recognition or reward. Amen.","verse":"Galatians 6:9","cc":[{"t":"Catholic","ref":"CCC §§2443–2449","q":"Why serve others?"},{"t":"Anglican","ref":"ACNA Q104","q":"What is Christian service?"},{"t":"Lutheran","ref":"Fifth Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q107","q":"What does love require?"},{"t":"Westminster","ref":"Q135","q":"What duties do we owe others?"},{"t":"Baptist","ref":"Q74","q":"Why love our neighbor?"}],"christ":"Christ served humanity even while many rejected Him.","comp":"Every Christian tradition teaches selfless service modeled after Christ.","observe":"Why did David help Keilah?","interpret":"What motivates true service?","apply":"How can I serve without expecting recognition?","pray":"Ask God for a servant's heart.","why":"David demonstrates godly leadership before becoming king.","notes":"Keilah's response reminds believers that faithfulness is not dependent upon gratitude."},{"m":5,"d":18,"name":"Jonathan Encourages David","theme":"Strengthened by Friendship","desc":"Jonathan visits David in the wilderness and strengthens his faith in God's promises.","cat":"Friendship","tl":"United Monarchy","primary":"1 Samuel 23:15–18","supp":["Ecclesiastes 4:9–12","Hebrews 10:24–25","Psalm 133"],"collect":"Father, surround me with faithful friends who encourage me to follow You more closely. Amen.","verse":"1 Samuel 23:16","cc":[{"t":"Catholic","ref":"CCC §§1939–1942","q":"Why encourage one another?"},{"t":"Anglican","ref":"ACNA Q104","q":"What is Christian fellowship?"},{"t":"Lutheran","ref":"Fifth Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q107","q":"What does love require?"},{"t":"Westminster","ref":"Q135","q":"What duties do Christians owe one another?"},{"t":"Baptist","ref":"Q74","q":"Why encourage fellow believers?"}],"christ":"Jonathan reflects Christ's ministry of strengthening His disciples before their trials.","comp":"Every Christian tradition values mutual encouragement within the Body of Christ.","observe":"Why was Jonathan's visit important?","interpret":"How do Christian friendships strengthen faith?","apply":"Who encourages me spiritually?","pray":"Thank God for faithful friends.","why":"The final recorded meeting between David and Jonathan.","notes":"Jonathan's humility continues to place God's will above personal ambition."},{"m":5,"d":19,"name":"David Spares Saul","theme":"Mercy Instead of Revenge","desc":"David refuses to kill Saul when given the opportunity, trusting God rather than taking justice into his own hands.","cat":"Christian Living","tl":"United Monarchy","primary":"1 Samuel 24","supp":["Romans 12:17–21","Matthew 5:44","Psalm 57"],"collect":"Merciful Father, teach me to forgive others and trust You with justice. Amen.","verse":"1 Samuel 24:6","cc":[{"t":"Catholic","ref":"CCC §§2302–2303","q":"Why forgive our enemies?"},{"t":"Anglican","ref":"ACNA Q104","q":"How should Christians respond to enemies?"},{"t":"Lutheran","ref":"Fifth Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q107","q":"What does love require?"},{"t":"Westminster","ref":"Q136","q":"What sins are forbidden?"},{"t":"Baptist","ref":"Q75","q":"Why forgive others?"}],"christ":"Christ showed perfect mercy toward those who sought His death.","comp":"Every Christian tradition teaches forgiveness while trusting God's justice.","observe":"Why didn't David seize the throne?","interpret":"What does mercy require?","apply":"Who do I need to forgive?","pray":"Pray for those who have hurt you.","why":"One of David's greatest demonstrations of restraint.","notes":"David viewed Saul's office as established by God despite Saul's failures."},{"m":5,"d":20,"name":"Abigail's Wisdom","theme":"Wisdom Prevents Violence","desc":"Abigail's humility and wisdom prevent David from committing unnecessary bloodshed.","cat":"Wisdom","tl":"United Monarchy","primary":"1 Samuel 25","supp":["Proverbs 15:1","James 3:17","Psalm 19"],"collect":"Lord, grant me wisdom to respond with gentleness and discernment in moments of conflict. Amen.","verse":"James 3:17","cc":[{"t":"Catholic","ref":"CCC §§1806–1809","q":"What is prudence?"},{"t":"Anglican","ref":"ACNA Q104","q":"What virtues should Christians pursue?"},{"t":"Lutheran","ref":"Fifth Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q107","q":"What does love require?"},{"t":"Westminster","ref":"Q135","q":"What duties do we owe others?"},{"t":"Baptist","ref":"Q74","q":"Why pursue wisdom?"}],"christ":"Abigail's peacemaking reflects Christ, the Prince of Peace, who reconciles sinners to God.","comp":"Every Christian tradition praises wisdom that promotes peace.","observe":"Why did Abigail intervene?","interpret":"How does wisdom prevent conflict?","apply":"How can I become a peacemaker?","pray":"Pray for wisdom in difficult relationships.","why":"Abigail becomes one of Scripture's greatest examples of godly wisdom.","notes":"Her actions prevented bloodshed and changed David's course."},{"m":5,"d":21,"name":"Mercy Again","theme":"Trusting God's Justice","desc":"David once again spares Saul's life, demonstrating consistent trust that God alone determines the proper time for justice and kingship.","cat":"Faith","tl":"United Monarchy","primary":"1 Samuel 26","supp":["Deuteronomy 32:35","1 Peter 2:21–23","Psalm 37"],"collect":"Righteous God, help me trust Your timing and Your justice even when I long for immediate answers. Amen.","verse":"1 Samuel 26:23","cc":[{"t":"Catholic","ref":"CCC §§1817–1821","q":"What is Christian hope?"},{"t":"Anglican","ref":"ACNA Q102","q":"What gives Christians hope?"},{"t":"Lutheran","ref":"First Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q1","q":"What is your only comfort?"},{"t":"Westminster","ref":"Q1","q":"What is our only comfort?"},{"t":"Baptist","ref":"Q1","q":"What is our only hope?"}],"christ":"Christ entrusted Himself completely to the Father's righteous judgment, even on the Cross.","comp":"Every Christian tradition teaches believers to trust God's justice instead of seeking revenge.","observe":"Why spare Saul a second time?","interpret":"What does waiting on God require?","apply":"Where do I struggle with impatience?","pray":"Pray for confidence in God's perfect timing.","why":"Reinforces David's integrity before he becomes king.","notes":"David's repeated mercy distinguishes him from the kings of surrounding nations."},{"m":5,"d":22,"name":"Among the Philistines","theme":"Waiting in Exile","desc":"David seeks refuge among the Philistines while continuing to trust God's promises despite uncertain circumstances.","cat":"Faith","tl":"United Monarchy","primary":"1 Samuel 27","supp":["Hebrews 11:13–16","Psalm 56","Romans 8:28"],"collect":"Lord, help me trust You even when I cannot see how Your promises will be fulfilled. Amen.","verse":"Psalm 56:3","cc":[{"t":"Catholic","ref":"CCC §§1817–1821","q":"What is Christian hope?"},{"t":"Anglican","ref":"ACNA Q102","q":"What is Christian hope?"},{"t":"Lutheran","ref":"First Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q1","q":"What is your only comfort?"},{"t":"Westminster","ref":"Q1","q":"What is our only comfort?"},{"t":"Baptist","ref":"Q1","q":"What is our only hope?"}],"christ":"Christ also lived as one rejected before being openly recognized as King.","comp":"Every Christian tradition teaches patient trust during seasons of uncertainty.","observe":"Why did David flee?","interpret":"How does God work through uncertainty?","apply":"How can I trust God while waiting?","pray":"Pray for steadfast hope.","why":"Continues David's years of preparation.","notes":"David lived among Israel's enemies without abandoning God's covenant."},{"m":5,"d":23,"name":"The Witch of Endor","theme":"Seeking God the Wrong Way","desc":"Saul turns to a medium instead of seeking the Lord, illustrating the danger of rejecting God's revealed will.","cat":"Doctrine","tl":"United Monarchy","primary":"1 Samuel 28","supp":["Isaiah 8:19–20","Deuteronomy 18:9–14","Psalm 119"],"collect":"Holy God, keep me faithful to Your Word and guard me from every false source of guidance. Amen.","verse":"Deuteronomy 18:12","cc":[{"t":"Catholic","ref":"CCC §§2115–2117","q":"Why reject occult practices?"},{"t":"Anglican","ref":"ACNA Q74","q":"What is forbidden by the First Commandment?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q94","q":"What does God forbid?"},{"t":"Westminster","ref":"Q109","q":"What sins are forbidden?"},{"t":"Baptist","ref":"Q50","q":"Why reject false worship?"}],"christ":"Christ is God's final and perfect revelation; believers need seek no other spiritual authority.","comp":"Every Christian tradition rejects occult practices and calls believers to trust God's revelation alone.","observe":"Why did Saul seek a medium?","interpret":"Why is God's Word sufficient?","apply":"Where do I seek guidance?","pray":"Pray for discernment and faithfulness.","why":"Contrasts Saul's despair with David's trust.","notes":"Saul's visit to Endor marks the tragic climax of his spiritual decline."},{"m":5,"d":24,"name":"Strengthened for the Journey","theme":"God's Compassion","desc":"God strengthens David and his men before they continue their difficult journey.","cat":"Christian Living","tl":"United Monarchy","primary":"1 Samuel 30:1–10","supp":["Isaiah 40:28–31","Philippians 4:13","Psalm 121"],"collect":"Father, renew my strength when I grow weary and help me rely upon Your power. Amen.","verse":"1 Samuel 30:6","cc":[{"t":"Catholic","ref":"CCC §§1817–1821","q":"Where does our strength come from?"},{"t":"Anglican","ref":"ACNA Q18","q":"How does God sustain His people?"},{"t":"Lutheran","ref":"First Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q26","q":"What is God's providence?"},{"t":"Westminster","ref":"Q11","q":"What are God's works?"},{"t":"Baptist","ref":"Q18","q":"How does God care for us?"}],"christ":"David strengthened himself in the Lord, foreshadowing Christ's complete dependence upon the Father.","comp":"Every Christian tradition teaches reliance upon God's strength rather than human ability.","observe":"What gave David strength?","interpret":"How does God sustain believers?","apply":"Where do I need renewed strength?","pray":"Ask God to strengthen you today.","why":"David prepares for the final transition to kingship.","notes":"Ziklag became a place where David learned deeper dependence upon God."},{"m":5,"d":25,"name":"Sharing the Blessing","theme":"Generosity","desc":"David shares the spoils of victory with those who remained behind, demonstrating generosity and unity among God's people.","cat":"Christian Living","tl":"United Monarchy","primary":"1 Samuel 30:21–31","supp":["Acts 20:35","2 Corinthians 9:6–8","Psalm 133"],"collect":"Generous Father, teach me to share freely as You have generously blessed me. Amen.","verse":"Acts 20:35","cc":[{"t":"Catholic","ref":"CCC §§1939–1942","q":"Why share with others?"},{"t":"Anglican","ref":"ACNA Q104","q":"What is Christian generosity?"},{"t":"Lutheran","ref":"Seventh Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q111","q":"What does God require?"},{"t":"Westminster","ref":"Q141","q":"What duties do we owe others?"},{"t":"Baptist","ref":"Q78","q":"Why practice generosity?"}],"christ":"Christ freely shares the riches of His grace with His people.","comp":"Every Christian tradition encourages generosity as an expression of gratitude.","observe":"Why did David share equally?","interpret":"What does generosity accomplish?","apply":"How can I bless others?","pray":"Thank God for His abundant gifts.","why":"Demonstrates David's heart as a shepherd of God's people.","notes":"David established a principle of shared blessing that endured in Israel."},{"m":5,"d":26,"name":"Saul's Death","theme":"The End of a Kingdom","desc":"Saul dies in battle, bringing his troubled reign to an end and demonstrating the tragic consequences of persistent disobedience.","cat":"Character Study","tl":"United Monarchy","primary":"1 Samuel 31","supp":["Romans 6:23","Hebrews 3:12–15","Psalm 90"],"collect":"Merciful God, keep my heart faithful to You and preserve me from hardening my heart against Your voice. Amen.","verse":"Romans 6:23","cc":[{"t":"Catholic","ref":"CCC §§1849–1869","q":"What are the consequences of sin?"},{"t":"Anglican","ref":"ACNA Q74","q":"What is sin?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q84","q":"What is unbelief?"},{"t":"Westminster","ref":"Q87","q":"What is repentance?"},{"t":"Baptist","ref":"Q77","q":"Why avoid sin?"}],"christ":"Saul's tragic end reminds us of humanity's need for the perfectly obedient King, Jesus Christ.","comp":"Every Christian tradition sees Saul as a warning against persistent rebellion.","observe":"What led to Saul's downfall?","interpret":"How does sin gradually harden the heart?","apply":"Where do I need repentance?","pray":"Pray for perseverance in faith.","why":"Ends the reign of Israel's first king.","notes":"Saul ruled approximately forty years before his death."},{"m":5,"d":27,"name":"David Mourns Saul","theme":"Honoring Even in Loss","desc":"David mourns Saul and Jonathan, refusing to rejoice over the death of his enemy and honoring God's anointed king.","cat":"Character Study","tl":"United Monarchy","primary":"2 Samuel 1","supp":["Romans 12:15","Matthew 5:44","Psalm 35"],"collect":"Lord, teach me to honor others with grace, even when relationships have been difficult. Amen.","verse":"2 Samuel 1:23","cc":[{"t":"Catholic","ref":"CCC §§2302–2303","q":"Why love our enemies?"},{"t":"Anglican","ref":"ACNA Q104","q":"How should Christians respond to enemies?"},{"t":"Lutheran","ref":"Fifth Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q107","q":"What does love require?"},{"t":"Westminster","ref":"Q135","q":"What duties do we owe our neighbor?"},{"t":"Baptist","ref":"Q75","q":"Why forgive?"}],"christ":"Christ wept over Jerusalem and prayed for His enemies from the Cross.","comp":"Every Christian tradition encourages compassion rather than revenge.","observe":"Why did David mourn?","interpret":"What does grief reveal about character?","apply":"How can I honor others with grace?","pray":"Pray for those who have hurt you.","why":"Reveals David's remarkable integrity.","notes":"David's lament is among the finest examples of Hebrew poetry."},{"m":5,"d":28,"name":"David Crowned","theme":"God's Timing","desc":"David is anointed king over Judah after years of waiting upon the Lord's timing.","cat":"Leadership","tl":"United Monarchy","primary":"2 Samuel 2","supp":["Psalm 75","James 4:10","Psalm 18"],"collect":"Sovereign Lord, teach me to wait patiently for Your perfect timing in every season of life. Amen.","verse":"James 4:10","cc":[{"t":"Catholic","ref":"CCC §§302–314","q":"What is Divine Providence?"},{"t":"Anglican","ref":"ACNA Q18","q":"How does God govern history?"},{"t":"Lutheran","ref":"First Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q27","q":"What is God's providence?"},{"t":"Westminster","ref":"Q11","q":"What are God's works?"},{"t":"Baptist","ref":"Q18","q":"How does God rule creation?"}],"christ":"David finally receives the throne because God gives it, not because David seized it.","comp":"Every Christian tradition teaches patience under God's providence.","observe":"Why did David wait?","interpret":"Why is God's timing better than ours?","apply":"Where am I tempted to rush ahead?","pray":"Thank God for His perfect timing.","why":"Marks the beginning of David's reign.","notes":"David first ruled Judah before becoming king over all Israel."},{"m":5,"d":29,"name":"United Under David","theme":"Shepherd King","desc":"David becomes king over all Israel, uniting the tribes under God's chosen shepherd.","cat":"Leadership","tl":"United Monarchy","primary":"2 Samuel 5","supp":["Ezekiel 34:23–24","John 10:11","Psalm 78"],"collect":"Good Shepherd, lead me faithfully as I follow You, and help me care well for those You entrust to me. Amen.","verse":"2 Samuel 5:2","cc":[{"t":"Catholic","ref":"CCC §§436–440","q":"Why is Christ the Good Shepherd?"},{"t":"Anglican","ref":"ACNA Q112","q":"What offices does Christ fulfill?"},{"t":"Lutheran","ref":"Apostles' Creed—Second Article","q":"What has Christ done?"},{"t":"Heidelberg","ref":"Q31","q":"Why is Christ our King?"},{"t":"Westminster","ref":"Q26","q":"How does Christ execute His kingly office?"},{"t":"Baptist","ref":"Q31","q":"Why is Jesus our King?"}],"christ":"David's shepherd-kingship points directly to Jesus, the Good Shepherd and eternal King.","comp":"Every Christian tradition recognizes David as a foreshadowing of Christ's kingship.","observe":"Why describe David as a shepherd?","interpret":"What qualities define godly leadership?","apply":"How can I care well for others?","pray":"Pray for leaders who shepherd faithfully.","why":"David begins the united monarchy.","notes":"Jerusalem becomes Israel's political and spiritual center under David."},{"m":5,"d":30,"name":"Bringing the Ark","theme":"Worship with Reverence","desc":"David seeks to bring the Ark to Jerusalem, but learns that sincere intentions must still honor God's holiness.","cat":"Worship","tl":"United Monarchy","primary":"2 Samuel 6","supp":["Hebrews 12:28–29","Psalm 24","John 4:23–24"],"collect":"Holy God, teach me to worship You with reverence, joy, and humble obedience. Amen.","verse":"Psalm 24:3–4","cc":[{"t":"Catholic","ref":"CCC §§208–213","q":"What is God's holiness?"},{"t":"Anglican","ref":"ACNA Q141","q":"Why worship God reverently?"},{"t":"Lutheran","ref":"Third Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q90","q":"Why gather for worship?"},{"t":"Westminster","ref":"Q91","q":"What pleases God?"},{"t":"Baptist","ref":"Q90","q":"Why worship faithfully?"}],"christ":"Christ brings believers into God's holy presence through His perfect righteousness.","comp":"Every Christian tradition teaches that worship joins joy with reverence.","observe":"Why was Uzzah judged?","interpret":"What does holy worship require?","apply":"How can I approach worship more thoughtfully?","pray":"Pray for reverence and joy in worship.","why":"David learns that zeal must be joined with obedience.","notes":"The Ark represented God's covenant presence among His people."},{"m":5,"d":31,"name":"An Everlasting Kingdom","theme":"God's Covenant with David","desc":"God promises David an everlasting kingdom, establishing the covenant that ultimately finds its fulfillment in Jesus Christ.","cat":"Covenant","tl":"United Monarchy","primary":"2 Samuel 7","supp":["Luke 1:30–33","Acts 2:29–36","Psalm 89"],"collect":"Eternal King, thank You for fulfilling Your promises through Jesus Christ, whose kingdom shall never end. Amen.","verse":"2 Samuel 7:16","cc":[{"t":"Catholic","ref":"CCC §§2578–2580","q":"What is the Davidic Covenant?"},{"t":"Anglican","ref":"ACNA Q112","q":"Why is Jesus the Son of David?"},{"t":"Lutheran","ref":"Apostles' Creed—Second Article","q":"What has Christ done?"},{"t":"Heidelberg","ref":"Q31","q":"Why is Christ our King?"},{"t":"Westminster","ref":"Q26","q":"How does Christ reign forever?"},{"t":"Baptist","ref":"Q31","q":"Why is Jesus the eternal King?"}],"christ":"This covenant is fulfilled in Jesus Christ, the Son of David, whose kingdom is everlasting and whose reign has no end.","comp":"Every Christian tradition views the Davidic Covenant as one of the Bible's greatest Messianic promises.","observe":"What did God promise David?","interpret":"How does Jesus fulfill this covenant?","apply":"How does Christ's eternal kingdom shape my hope?","pray":"Praise Christ, the everlasting King.","why":"Concludes May by looking beyond David to the Messiah.","notes":"The Davidic Covenant becomes foundational for the prophets and the New Testament's presentation of Jesus as the promised King."},{"m":6,"d":1,"name":"A Covenant Forever","theme":"God's Eternal Promise","desc":"God establishes His covenant with David, promising an everlasting kingdom that ultimately finds its fulfillment in Jesus Christ.","cat":"Covenant","tl":"United Monarchy","primary":"2 Samuel 7","supp":["Luke 1:30–33","Acts 2:29–36","Psalm 89"],"collect":"Eternal King, thank You for keeping every promise through Jesus Christ, whose kingdom shall never end. Amen.","verse":"2 Samuel 7:16","cc":[{"t":"Catholic","ref":"CCC §§2578–2580","q":"What is the Davidic Covenant?"},{"t":"Anglican","ref":"ACNA Q112","q":"Why is Jesus called the Son of David?"},{"t":"Lutheran","ref":"Apostles' Creed—Second Article","q":"What has Christ done?"},{"t":"Heidelberg","ref":"Q31","q":"Why is Christ our King?"},{"t":"Westminster","ref":"Q26","q":"How does Christ reign forever?"},{"t":"Baptist","ref":"Q31","q":"Why is Jesus the eternal King?"}],"christ":"Jesus fulfills the covenant with David as the everlasting King whose reign has no end.","comp":"Every Christian tradition sees the Davidic Covenant fulfilled in Christ.","observe":"What promises did God make David?","interpret":"Why are God's covenants trustworthy?","apply":"How does Christ's kingdom shape my hope?","pray":"Praise Christ as your eternal King.","why":"Opens June by centering on God's covenant faithfulness.","notes":"This covenant becomes foundational for the prophets and the New Testament."},{"m":6,"d":2,"name":"The King Gives Thanks","theme":"Gratitude After Victory","desc":"David responds to God's blessings with thanksgiving, recognizing that every victory belongs to the Lord.","cat":"Worship","tl":"United Monarchy","primary":"2 Samuel 8","supp":["Psalm 18","James 1:17","Colossians 3:15–17"],"collect":"Lord, may gratitude always fill my heart as I remember Your faithfulness in every blessing. Amen.","verse":"Psalm 18:2","cc":[{"t":"Catholic","ref":"CCC §§2637–2638","q":"Why do Christians give thanks?"},{"t":"Anglican","ref":"ACNA Q141","q":"Why should Christians thank God?"},{"t":"Lutheran","ref":"First Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q27","q":"What is God's providence?"},{"t":"Westminster","ref":"Q1","q":"What is our only comfort?"},{"t":"Baptist","ref":"Q11","q":"Why trust God?"}],"christ":"Christ continually gives thanks to the Father and teaches His people grateful hearts.","comp":"Every Christian tradition emphasizes thanksgiving as central to Christian worship.","observe":"What victories came from God?","interpret":"Why is gratitude essential?","apply":"What blessings have I overlooked?","pray":"Thank God for His faithfulness today.","why":"David's victories expand Israel's borders.","notes":"David consistently attributes success to God rather than himself."},{"m":6,"d":3,"name":"Kindness to Mephibosheth","theme":"Covenant Mercy","desc":"David shows extraordinary kindness to Jonathan's son Mephibosheth because of his covenant with Jonathan.","cat":"Christian Living","tl":"United Monarchy","primary":"2 Samuel 9","supp":["Ephesians 2:4–9","Luke 14:12–24","Psalm 103"],"collect":"Merciful Father, teach me to show grace to others as You have shown grace to me. Amen.","verse":"2 Samuel 9:7","cc":[{"t":"Catholic","ref":"CCC §§1996–2005","q":"What is grace?"},{"t":"Anglican","ref":"ACNA Q112","q":"What is salvation by grace?"},{"t":"Lutheran","ref":"Second Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q60","q":"How are sinners justified?"},{"t":"Westminster","ref":"Q33","q":"What is justification?"},{"t":"Baptist","ref":"Q37","q":"How are sinners saved?"}],"christ":"David's kindness to Mephibosheth beautifully illustrates Christ's undeserved grace toward sinners.","comp":"Every Christian tradition teaches salvation as God's gracious gift.","observe":"Why did David seek Mephibosheth?","interpret":"What does grace look like?","apply":"How can I extend grace to someone today?","pray":"Thank Christ for His mercy.","why":"One of Scripture's clearest pictures of covenant grace.","notes":"Mephibosheth ate continually at the king's table despite his inability to repay David."},{"m":6,"d":4,"name":"Walking in Integrity","theme":"Living Before God","desc":"David seeks to rule Israel with justice, integrity, and righteousness before the Lord.","cat":"Christian Living","tl":"United Monarchy","primary":"Psalm 101","supp":["Micah 6:8","Titus 2:11–14","Psalm 15"],"collect":"Holy God, help me walk in integrity before You in every area of my life. Amen.","verse":"Psalm 101:2","cc":[{"t":"Catholic","ref":"CCC §§1803–1832","q":"What are the cardinal virtues?"},{"t":"Anglican","ref":"ACNA Q104","q":"What is holiness?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q86","q":"Why pursue holiness?"},{"t":"Westminster","ref":"Q91","q":"What pleases God?"},{"t":"Baptist","ref":"Q90","q":"How should Christians live?"}],"christ":"Christ perfectly embodies righteousness and holiness in every thought and action.","comp":"Every Christian tradition teaches that Christian character reflects God's holiness.","observe":"What standards did David set?","interpret":"Why does integrity matter?","apply":"Where do I need greater consistency?","pray":"Pray for an undivided heart.","why":"Highlights David's desire to govern faithfully.","notes":"Psalm 101 is often called \"The Psalm of the King.\""},{"m":6,"d":5,"name":"The Shepherd King","theme":"Caring Leadership","desc":"David leads Israel as a shepherd, reminding God's people that leadership exists to serve rather than dominate.","cat":"Leadership","tl":"United Monarchy","primary":"Ezekiel 34:11–24","supp":["John 10:11–18","1 Peter 5:1–4","Psalm 23"],"collect":"Good Shepherd, help me follow Your example of humble and sacrificial leadership. Amen.","verse":"John 10:11","cc":[{"t":"Catholic","ref":"CCC §§754–757","q":"Why is Christ the Good Shepherd?"},{"t":"Anglican","ref":"ACNA Q112","q":"How does Christ care for His Church?"},{"t":"Lutheran","ref":"Apostles' Creed—Second Article","q":"What has Christ done?"},{"t":"Heidelberg","ref":"Q31","q":"Why is Christ our King?"},{"t":"Westminster","ref":"Q26","q":"How does Christ rule His people?"},{"t":"Baptist","ref":"Q31","q":"Why is Jesus our Shepherd?"}],"christ":"Jesus perfectly fulfills every promise of the Shepherd King foretold in Scripture.","comp":"Every Christian tradition recognizes Christ as the Good Shepherd.","observe":"What makes a shepherd different from a ruler?","interpret":"Why does Jesus use this image?","apply":"How can I serve others selflessly?","pray":"Pray for pastors and church leaders.","why":"Expands on David's shepherd imagery.","notes":"Ezekiel later points beyond David to the Messiah."},{"m":6,"d":6,"name":"The Lord Is My Shepherd","theme":"Trust in God's Care","desc":"David reflects upon God's faithful care throughout every season of life, proclaiming complete confidence in the Lord's guidance.","cat":"Worship","tl":"Psalms","primary":"Psalm 23","supp":["John 10:1–18","Revelation 7:16–17","Psalm 121"],"collect":"Shepherd of my soul, lead me safely each day until I dwell forever in Your presence. Amen.","verse":"Psalm 23:1","cc":[{"t":"Catholic","ref":"CCC §§2578–2580","q":"Why do the Psalms matter?"},{"t":"Anglican","ref":"ACNA Q31","q":"Why pray the Psalms?"},{"t":"Lutheran","ref":"First Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q26","q":"What is God's providence?"},{"t":"Westminster","ref":"Q1","q":"What is our only comfort?"},{"t":"Baptist","ref":"Q1","q":"What is our only hope?"}],"christ":"Psalm 23 reaches its fullest meaning in Jesus Christ, the Good Shepherd who lays down His life for His sheep.","comp":"Every Christian tradition treasures Psalm 23 as one of Scripture's greatest prayers of trust.","observe":"What images describe God's care?","interpret":"Why is the Shepherd image so comforting?","apply":"Where do I need to trust God's guidance?","pray":"Pray Psalm 23 slowly and thoughtfully.","why":"Introduces a section emphasizing David's Psalms.","notes":"Psalm 23 has comforted believers for nearly three thousand years."},{"m":6,"d":7,"name":"The King of Glory","theme":"Worship the Holy King","desc":"David celebrates God's holiness and majesty as the rightful King over all creation.","cat":"Worship","tl":"Psalms","primary":"Psalm 24","supp":["Revelation 5:11–14","Philippians 2:9–11","Isaiah 6:1–8"],"collect":"King of Glory, reign over my heart and receive all honor, praise, and worship forever. Amen.","verse":"Psalm 24:10","cc":[{"t":"Catholic","ref":"CCC §§2095–2097","q":"Why worship God alone?"},{"t":"Anglican","ref":"ACNA Q141","q":"Why should Christians worship?"},{"t":"Lutheran","ref":"Third Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q90","q":"Why gather for worship?"},{"t":"Westminster","ref":"Q46","q":"What is the First Commandment?"},{"t":"Baptist","ref":"Q50","q":"Why worship God alone?"}],"christ":"Jesus is the King of Glory who enters triumphantly and reigns forever.","comp":"Every Christian tradition proclaims Christ as Lord of heaven and earth.","observe":"Who is the King of Glory?","interpret":"What qualifies someone to stand before God?","apply":"How can my worship reflect God's holiness?","pray":"Offer praise to Christ, the King of Glory.","why":"Concludes the first week with worship.","notes":"Psalm 24 was traditionally associated with bringing the Ark to Jerusalem and later connected by Christians to Christ's triumphal entry and ascension."},{"m":6,"d":8,"name":"The Heavens Declare","theme":"God's Glory Revealed","desc":"David celebrates God's revelation through both creation and His written Word, proclaiming that all creation points to its Creator.","cat":"Worship","tl":"Psalms","primary":"Psalm 19","supp":["Romans 1:18–20","John 1:1–5","Psalm 8"],"collect":"Creator God, open my eyes to see Your glory in creation and Your truth in Your Word. Through Jesus Christ our Lord. Amen.","verse":"Psalm 19:1","cc":[{"t":"Catholic","ref":"CCC §§31–35","q":"How can we know God through creation?"},{"t":"Anglican","ref":"ACNA Q16","q":"How does creation reveal God?"},{"t":"Lutheran","ref":"First Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q26","q":"What is God's providence?"},{"t":"Westminster","ref":"Q2","q":"What rule has God given?"},{"t":"Baptist","ref":"Q3","q":"Why study Scripture?"}],"christ":"Christ is both the eternal Word and the One through whom all things were created.","comp":"Every Christian tradition recognizes both creation and Scripture as testimonies to God's glory.","observe":"What does creation reveal?","interpret":"Why is Scripture greater than creation alone?","apply":"How can I better appreciate God's revelation?","pray":"Praise God for His creation and His Word.","why":"Begins a series highlighting David's worship.","notes":"Psalm 19 has been foundational in Christian discussions of general and special revelation."},{"m":6,"d":9,"name":"Blessed Is the Forgiven","theme":"Joy of Repentance","desc":"David rejoices in the freedom that comes through God's forgiveness after sincere confession of sin.","cat":"Repentance","tl":"Psalms","primary":"Psalm 32","supp":["1 John 1:8–9","Romans 4:6–8","Psalm 103"],"collect":"Merciful Father, thank You for forgiving my sins through Christ and restoring me to joyful fellowship with You. Amen.","verse":"Psalm 32:1","cc":[{"t":"Catholic","ref":"CCC §§1422–1498","q":"Why confess our sins?"},{"t":"Anglican","ref":"ACNA Q127","q":"What is repentance?"},{"t":"Lutheran","ref":"Confession","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q88","q":"What is true repentance?"},{"t":"Westminster","ref":"Q89","q":"What is repentance unto life?"},{"t":"Baptist","ref":"Q87","q":"Why should Christians repent?"}],"christ":"Christ offers complete forgiveness through His atoning death and resurrection.","comp":"Every Christian tradition teaches that forgiveness is found through God's grace in Christ.","observe":"Why does confession bring joy?","interpret":"What happens when we hide sin?","apply":"Is there anything I need to confess?","pray":"Thank Christ for His forgiveness.","why":"Highlights the blessing of restored fellowship with God.","notes":"Paul later quotes Psalm 32 in Romans to explain justification by faith."},{"m":6,"d":10,"name":"Wait for the Lord","theme":"Patient Hope","desc":"David encourages believers to wait confidently upon God's timing even when circumstances seem uncertain.","cat":"Christian Living","tl":"Psalms","primary":"Psalm 27","supp":["Isaiah 40:28–31","James 5:7–11","Lamentations 3:25–26"],"collect":"Lord, teach me to wait patiently upon You, trusting that Your timing is always perfect. Amen.","verse":"Psalm 27:14","cc":[{"t":"Catholic","ref":"CCC §§1817–1821","q":"What is Christian hope?"},{"t":"Anglican","ref":"ACNA Q102","q":"What is Christian hope?"},{"t":"Lutheran","ref":"First Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q1","q":"What is your only comfort?"},{"t":"Westminster","ref":"Q1","q":"What is our only comfort?"},{"t":"Baptist","ref":"Q1","q":"What is our only hope?"}],"christ":"Jesus perfectly trusted the Father's timing throughout His earthly ministry.","comp":"Every Christian tradition teaches patient endurance rooted in hope.","observe":"Why is waiting difficult?","interpret":"What does biblical hope look like?","apply":"Where must I trust God's timing?","pray":"Pray for patience and perseverance.","why":"Continues David's emphasis on trusting God.","notes":"Psalm 27 balances confidence with honest longing."},{"m":6,"d":11,"name":"Search Me, O God","theme":"Invitation to Holiness","desc":"David invites God to examine his heart, desiring purity and faithfulness above outward appearance.","cat":"Holiness","tl":"Psalms","primary":"Psalm 139:23–24","supp":["Hebrews 4:12–13","James 1:22–25","Psalm 51"],"collect":"Holy God, search my heart, reveal anything that dishonors You, and lead me in Your everlasting way. Amen.","verse":"Psalm 139:23–24","cc":[{"t":"Catholic","ref":"CCC §§1691–1698","q":"What is holiness?"},{"t":"Anglican","ref":"ACNA Q104","q":"How should Christians live?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q86","q":"Why pursue holiness?"},{"t":"Westminster","ref":"Q90","q":"What is sanctification?"},{"t":"Baptist","ref":"Q90","q":"How should believers live?"}],"christ":"Christ perfectly fulfills the holiness that David longed for and transforms believers by His Spirit.","comp":"Every Christian tradition teaches continual growth in holiness.","observe":"Why invite God to examine us?","interpret":"What does true holiness require?","apply":"Where is God calling me to grow?","pray":"Pray for a clean heart.","why":"Encourages honest self-examination before God.","notes":"Psalm 139 concludes with one of Scripture's most profound prayers for spiritual examination."},{"m":6,"d":12,"name":"The Fool Says","theme":"Wisdom Begins with God","desc":"David contrasts the wisdom of those who acknowledge God with the folly of those who reject Him.","cat":"Wisdom","tl":"Psalms","primary":"Psalm 14","supp":["Proverbs 9:10","Romans 3:10–18","Psalm 111"],"collect":"Lord, grant me true wisdom that begins with reverence for You. Amen.","verse":"Psalm 14:1","cc":[{"t":"Catholic","ref":"CCC §§36–38","q":"Why is belief in God reasonable?"},{"t":"Anglican","ref":"ACNA Q15","q":"Who is God?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q2","q":"Why should we fear, love, and trust God?"},{"t":"Westminster","ref":"Q2","q":"What rule has God given?"},{"t":"Baptist","ref":"Q1","q":"What is humanity's purpose?"}],"christ":"Christ is the wisdom of God, revealing the Father perfectly.","comp":"Every Christian tradition teaches that true wisdom begins with the fear of the Lord.","observe":"What is biblical foolishness?","interpret":"Why does wisdom begin with God?","apply":"How can I pursue godly wisdom?","pray":"Ask God for wisdom today.","why":"Contrasts worldly thinking with biblical truth.","notes":"Paul quotes Psalm 14 in Romans to explain humanity's universal need for salvation."},{"m":6,"d":13,"name":"The Lord Is My Light","theme":"Confidence in Darkness","desc":"David proclaims unwavering confidence in God despite fear, danger, and uncertainty.","cat":"Faith","tl":"Psalms","primary":"Psalm 27","supp":["John 8:12","Romans 8:31–39","Psalm 46"],"collect":"Lord Jesus, be my light in every season and teach me to trust You without fear. Amen.","verse":"Psalm 27:1","cc":[{"t":"Catholic","ref":"CCC §§1817–1821","q":"What gives Christians hope?"},{"t":"Anglican","ref":"ACNA Q102","q":"What is Christian hope?"},{"t":"Lutheran","ref":"First Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q1","q":"What is your only comfort?"},{"t":"Westminster","ref":"Q1","q":"What is our only comfort?"},{"t":"Baptist","ref":"Q1","q":"What is our only hope?"}],"christ":"Jesus declares Himself to be the Light of the World, fulfilling David's confidence in God's saving presence.","comp":"Every Christian tradition proclaims Christ as the Light who overcomes darkness.","observe":"Why can David be fearless?","interpret":"What fears does faith overcome?","apply":"What fears should I surrender to God?","pray":"Entrust your fears to Christ.","why":"Returns to the theme of courageous trust.","notes":"Psalm 27 has long been used during times of persecution and uncertainty."},{"m":6,"d":14,"name":"The King Rejoices","theme":"Worship After Victory","desc":"David praises God for victories won through divine faithfulness rather than human strength, giving all glory to the Lord.","cat":"Worship","tl":"Psalms","primary":"Psalm 21","supp":["James 1:17","Revelation 19:1–8","Psalm 150"],"collect":"Almighty God, receive all praise and glory for every good gift and every victory You graciously provide. Amen.","verse":"Psalm 21:13","cc":[{"t":"Catholic","ref":"CCC §§2639–2643","q":"Why do Christians praise God?"},{"t":"Anglican","ref":"ACNA Q141","q":"Why should Christians worship?"},{"t":"Lutheran","ref":"Third Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q90","q":"Why gather for worship?"},{"t":"Westminster","ref":"Q91","q":"What are good works?"},{"t":"Baptist","ref":"Q90","q":"How should believers glorify God?"}],"christ":"Christ is the victorious King who receives everlasting praise from heaven and earth.","comp":"Every Christian tradition teaches that worship rightly gives glory to God alone.","observe":"Why does David praise God after victory?","interpret":"Why must worship follow blessing?","apply":"How can I cultivate a heart of praise?","pray":"End your day with thanksgiving and praise.","why":"Concludes the week by returning all glory to God.","notes":"Many royal psalms ultimately point beyond David to the reign of the Messiah."},{"m":6,"d":15,"name":"Trust in the Lord","theme":"God Our Refuge","desc":"David teaches that lasting security is found in God rather than wealth, power, or human success.","cat":"Faith","tl":"Psalms","primary":"Psalm 62","supp": nterpret":"How can idleness become dangerous?","apply":"Where do I need greater vigilance?","pray":"Pray for spiritual alertness.","why":"Begins one of Scripture's most sobering narratives.","notes":"Ancient kings typically accompanied their armies into battle."},{"m":6,"d":17,"name":"David and Bathsheba","theme":"The Deception of Sin","desc":"David's adultery reveals how even faithful believers can fall when they ignore God's commands.","cat":"Repentance","tl":"David's Reign","primary":"2 Samuel 11","supp":["James 1:13–15","Romans 6:23","Psalm 51"],"collect":"Merciful Father, guard my heart from temptation and strengthen me to walk in purity. Amen.","verse":"James 1:15","cc":[{"t":"Catholic","ref":"CCC §§1849–1869","q":"What are the consequences of sin?"},{"t":"Anglican","ref":"ACNA Q74","q":"What is sin?"},{"t":"Lutheran","ref":"Sixth Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q139","q":"What sins are forbidden?"},{"t":"Westminster","ref":"Q75","q":"Why avoid sin?"},{"t":"Baptist","ref":"Q77","q":"What does God require?"}],"christ":"David's failure magnifies humanity's need for the sinless Son of David, Jesus Christ.","comp":"Every Christian tradition teaches that no believer is beyond temptation.","observe":"How did sin progress?","interpret":"Why must temptation be resisted early?","apply":"What safeguards should I strengthen?","pray":"Pray for purity.","why":"Demonstrates sin's destructive progression.","notes":"David's greatest moral failure begins with a seemingly small compromise."},{"m":6,"d":18,"name":"Nathan's Parable","theme":"Loving Correction","desc":"Nathan courageously confronts David, leading him toward repentance through wisdom rather than accusation alone.","cat":"Repentance","tl":"David's Reign","primary":"2 Samuel 12:1–15","supp":["Galatians 6:1","Proverbs 27:5–6","Psalm 141"],"collect":"Lord, give me humility to receive correction and courage to lovingly correct others when necessary. Amen.","verse":"2 Samuel 12:13","cc":[{"t":"Catholic","ref":"CCC §§1427–1433","q":"What is repentance?"},{"t":"Anglican","ref":"ACNA Q127","q":"What is repentance?"},{"t":"Lutheran","ref":"Confession","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q88","q":"What is true repentance?"},{"t":"Westminster","ref":"Q87","q":"What is repentance unto life?"},{"t":"Baptist","ref":"Q89","q":"Why repent?"}],"christ":"Christ lovingly calls sinners to repentance and restoration.","comp":"Every tradition values loving correction rooted in grace and truth.","observe":"Why did Nathan tell a story?","interpret":"Why is correction difficult?","apply":"Am I teachable?","pray":"Pray for humility.","why":"Shows God's mercy through confrontation.","notes":"Nathan's parable remains one of Scripture's greatest examples of prophetic wisdom."},{"m":6,"d":19,"name":"Create in Me a Clean Heart","theme":"True Repentance","desc":"David's confession becomes one of Scripture's greatest prayers of repentance and restoration.","cat":"Prayer","tl":"Psalms","primary":"Psalm 51","supp":["1 John 1:9","Ezekiel 36:25–27","Psalm 32"],"collect":"Merciful God, create in me a clean heart and renew a right spirit within me. Amen.","verse":"Psalm 51:10","cc":[{"t":"Catholic","ref":"CCC §§1422–1498","q":"Why confess sin?"},{"t":"Anglican","ref":"ACNA Q127","q":"What is repentance?"},{"t":"Lutheran","ref":"Confession","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q88","q":"What is repentance?"},{"t":"Westminster","ref":"Q89","q":"What is repentance?"},{"t":"Baptist","ref":"Q87","q":"Why repent?"}],"christ":"Christ cleanses believers completely through His sacrifice.","comp":"Every Christian tradition treasures Psalm 51 as the model prayer of repentance.","observe":"What makes repentance genuine?","interpret":"Why ask for a new heart?","apply":"Pray Psalm 51 today.","pray":"Thank God for His forgiveness.","why":"Continues David's restoration.","notes":"Psalm 51 has been central to Christian worship for centuries."},{"m":6,"d":20,"name":" nce?"},{"t":"Westminster","ref":"Q11","q":"What are God's works?"},{"t":"Baptist","ref":"Q18","q":"How does God govern history?"}],"christ":"Solomon's birth preserves the line through which Christ will come.","comp":"Every Christian tradition praises God's redeeming providence.","observe":"Why does Solomon's birth matter?","interpret":"How does God redeem brokenness?","apply":"Where have I seen God bring hope from hardship?","pray":"Thank God for His restoring grace.","why":"Begins the transition toward Solomon's reign.","notes":"Solomon's name is related to the Hebrew word for \"peace.\""},{"m":6,"d":22,"name":"Absalom's Return","theme":"Broken Relationships","desc":"David's family struggles demonstrate how sin damages relationships across generations.","cat":"Family","tl":"David's Reign","primary":"2 Samuel 14","supp":["Ephesians 4:31–32","Colossians 3:13","Psalm 133"],"collect":"Lord, heal broken relationships and teach me forgiveness. Amen.","verse":"Ephesians 4:32","cc":[{"t":"Catholic","ref":"CCC §§2201–2206","q":"Why strengthen families?"},{"t":"Anglican","ref":"ACNA Q104","q":"Why forgive?"},{"t":"Lutheran","ref":"Fifth Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q107","q":"Love?"},{"t":"Westminster","ref":"Q135","q":"Neighbor?"},{"t":"Baptist","ref":"Q74","q":"Love?"}],"christ":"Christ reconciles sinners to God and one another.","comp":"Every tradition values reconciliation.","observe":"What broke David's family?","interpret":"Why is forgiveness difficult?","apply":"Seek reconciliation.","pray":"Pray for healing.","why":"Begins Absalom's rebellion.","notes":"Family conflict becomes a major theme."},{"m":6,"d":23,"name":"Absalom's Rebellion","theme":"Pride Before Destruction","desc":"Absalom exalts himself against his father, bringing division to Israel.","cat":"Wisdom","tl":"David's Reign","primary":"2 Samuel 15","supp":["Proverbs 16:18","James 4:6","Psalm 3"],"collect":"Lord, keep me humble before You. Amen.","verse":"Proverbs 16:18","cc":[{"t":"Catholic","ref":"CCC §§2546–2557","q":"Why humility?"},{"t":"Anglican","ref":"ACNA Q104","q":"Humility?"},{"t":"Lutheran","ref":"First Commandment","q":"Meaning?"},{"t":"Heidelberg","ref":"Q122","q":"Pride?"},{"t":"Westminster","ref":"Q82","q":"Humility?"},{"t":"Baptist","ref":"Q83","q":"Humility?"}],"christ":"Christ humbled Himself completely.","comp":"All traditions reject pride.","observe":"Why did Absalom rebel?","interpret":"What causes pride?","apply":"Practice humility.","pray":"Pray for humility.","why":"David flees Jerusalem.","notes":"Psalm 3 is linked to this event."},{"m":6,"d":24,"name":"Trust While Fleeing","theme":"Confidence in God","desc":"Even while fleeing his own son, David continues trusting the Lord.","cat":"Faith","tl":"David's Reign","primary":"Psalm 3","supp":["Romans 8:31","Hebrews 13:6","Psalm 46"],"collect":"Lord, be my shield in every trial. Amen.","verse":"Psalm 3:3","cc":[{"t":"Catholic","ref":"CCC §§1817–1821","q":"Hope?"},{"t":"Anglican","ref":"ACNA Q102","q":"Hope?"},{"t":"Lutheran","ref":"First Article","q":"Meaning?"},{"t":"Heidelberg","ref":"Q1","q":"Comfort?"},{"t":"Westminster","ref":"Q1","q":"Comfort?"},{"t":"Baptist","ref":"Q1","q":"Hope?"}],"christ":"Christ trusted the Father in suffering.","comp":"Every tradition emphasizes hope in hardship.","observe":"Why could David sleep?","interpret":"What gives peace?","apply":"Trust God tonight.","pray":"Rest in Him.","why":"Psalm born from crisis.","notes":"One of David's most personal prayers."},{"m":6,"d":25,"name":"Restore Me","theme":"Mercy in Suffering","desc":"David seeks God's mercy during painful discipline.","cat":"Prayer","tl":"Psalms","primary":"Psalm 6","supp":["Matthew 11:28","2 Corinthians 12:9","Psalm 130"],"collect":"Lord, hear my cry and sustain me. Amen.","verse":"Psalm 6:9","cc":[{"t":"Catholic","ref":"CCC §§2558–2565","q":"Prayer?"},{"t":"Anglican","ref":"ACNA Q141","q":"Prayer?"},{"t":"Lutheran","ref":"Lord's Prayer","q":"Meaning?"},{"t":"Heidelberg","ref":"Q116","q":"Prayer?"},{"t":"Westminster","ref":"Q116","q":"Prayer?"},{"t":"Baptist","ref":"Q108","q":"Prayer?"}],"christ":"Christ welcomes the weary.","comp":"All traditions emphasize prayer.","observe":"Why pray honestly?","interpret":"What is lament?","apply":"Bring burdens to God.","pray":"Pray honestly.","why":"Continues lament psalms.","notes":"One of the Penitential Psalms."},{"m":6,"d":26,"name":"The Lord Hears","theme":"Confidence After Prayer","desc":"David ends lament with confidence that God hears.","cat":"Prayer","tl":"Psalms","primary":"Psalm 6","supp":["1 John 5:14","Philippians 4:6","Psalm 34"],"collect":"Father, thank You for hearing every prayer offered in faith. Amen.","verse":"1 John 5:14","cc":[{"t":"Catholic","ref":"CCC §§2734–2745","q":"Confidence in prayer?"},{"t":"Anglican","ref":"ACNA Q141","q":"Prayer?"},{"t":"Lutheran","ref":"Lord's Prayer","q":"Meaning?"},{"t":"Heidelberg","ref":"Q116","q":"Prayer?"},{"t":"Westminster","ref":"Q116","q":"Prayer?"},{"t":"Baptist","ref":"Q108","q":"Prayer?"}],"christ":"Christ intercedes continually.","comp":"All traditions trust God's hearing.","observe":"What changed?","interpret":"How does prayer strengthen faith?","apply":"Pray boldly.","pray":"Thank God.","why":"Ends lament in hope.","notes":"Common pattern throughout the Psalms."},{"m":6,"d":27,"name":"The Lord Reigns","theme":"God's Justice","desc":"David celebrates God's righteous rule over every nation.","cat":"Worship","tl":"Psalm","primary":"Psalm 9","supp":["Revelation 19","Psalm 96","Romans 8"],"collect":"Lord, reign over all the earth. Amen.","verse":"Psalm 9:7","cc":[{"t":"Catholic","ref":"CCC §§2095–2097","q":"Worship?"},{"t":"Anglican","ref":"ACNA Q141","q":"Worship?"},{"t":"Lutheran","ref":"Third Commandment","q":"Meaning?"},{"t":"Heidelberg","ref":"Q90","q":"Worship?"},{"t":"Westminster","ref":"Q46","q":"Worship?"},{"t":"Baptist","ref":"Q50","q":"Worship?"}],"christ":"Christ reigns forever.","comp":"All traditions proclaim Christ as ng the Father's will.","comp":"Every Christian tradition teaches that true wisdom begins with God.","observe":"Why did Solomon ask for wisdom?","interpret":"What makes biblical wisdom different from knowledge?","apply":"Where do I need God's wisdom today?","pray":"Pray for discernment.","why":"Introduces Solomon's reign.","notes":"Solomon's request pleased God because it was selfless."},{"m":7,"d":2,"name":"Wisdom Revealed","theme":"Justice with Compassion","desc":"Solomon's famous judgment demonstrates wisdom that seeks truth while protecting the innocent.","cat":"Leadership","tl":"United Monarchy","primary":"1 Kings 3:16–28","supp":["Micah 6:8","James 3:17","Psalm 72"],"collect":"Lord, help me pursue justice with wisdom, mercy, and humility. Amen.","verse":"James 3:17","cc":[{"t":"Catholic","ref":"CCC §§1805–1809","q":"What is justice?"},{"t":"Anglican","ref":"ACNA Q104","q":"What virtues should Christians pursue?"},{"t":"Lutheran","ref":"Fifth Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q107","q":"Love?"},{"t":"Westminster","ref":"Q135","q":"Duties?"},{"t":"Baptist","ref":"Q74","q":"Neighbor?"}],"christ":"Christ judges with perfect righteousness and mercy.","comp":"Every Christian tradition values justice rooted in God's wisdom.","observe":"Why was Solomon's judgment effective?","interpret":"How does wisdom seek truth?","apply":"Show fairness today.","pray":"Pray for wise decisions.","why":"Demonstrates wisdom in action.","notes":"This account made Solomon famous throughout the ancient world."},{"m":7,"d":3,"name":"A Kingdom at Peace","theme":"God's Blessing","desc":"Israel experiences peace and prosperity under Solomon's early reign.","cat":"Thanksgiving","tl":"United Monarchy","primary":"1 Kings 4","supp":["Psalm 127","James 1:17","Psalm 145"],"collect":"Father, thank You for every blessing and remind me that prosperity comes from Your hand. Amen.","verse":"1 Kings 4:25","cc":[{"t":"Catholic","ref":"CCC §§301–314","q":"What is Providence?" ","ref":"Q95","q":"Church?"}],"christ":"Christ is Emmanuel—God with us—and His Church is His dwelling place by the Spirit.","comp":"Every Christian tradition celebrates God's presence among His people.","observe":"What did the Ark represent?","interpret":"How has God's dwelling changed?","apply":"Live aware of God's presence.","pray":"Thank Him for being near.","why":"Begins the Temple dedication.","notes":"The cloud symbolized God's glorious presence (the Shekinah)."},{"m":7,"d":9,"name":"Solomon's Prayer","theme":"Humble Dedication","desc":"Solomon dedicates the Temple with a prayer acknowledging that even the heavens cannot contain God.","cat":"Prayer","tl":"United Monarchy","primary":"1 Kings 8:22–53","supp":["Matthew 6:9–13","Psalm 86","Philippians 4:6"],"collect":"Lord, teach me to pray with humility, confidence, and reverence. Amen.","verse":"1 Kings 8:27","cc":[{"t":"Catholic","ref":"CCC §§2558–2565","q":"What is prayer?"},{"t":"Anglican","ref":"ACNA Q141","q":"Why pray?"},{"t":"Lutheran","ref":"Lord's Prayer","q":"Meaning?"},{"t":"Heidelberg","ref":"Q116","q":"Prayer?"},{"t":"Westminster","ref":"Q116","q":"Prayer?"},{"t":"Baptist","ref":"Q108","q":"Prayer?"}],"christ":"Jesus teaches the perfect model of prayer and intercedes continually for His people.","comp":"Every Christian tradition treasures prayer as communion with God.","observe":"Why was Solomon's prayer humble?","interpret":"What does it teach about God?","apply":"Deepen your prayer life.","pray":"Spend extra time in prayer today.","why":"The longest recorded prayer in 1 Kings.","notes":"Solomon balances reverence with confidence."},{"m":7,"d":10,"name":"Fire from Heaven","theme":"God's Approval","desc":"God visibly accepts Israel's worship, demonstrating His pleasure in sincere devotion.","cat":"Worship","tl":"United Monarchy","primary":"2 Chronicles 7:1–10","supp":["Hebrews 12:28–29","Romans 12:1","Psalm 100"],"collect":"Lord, receive my life as a living sacrifice offered in joyful worship. Amen.
