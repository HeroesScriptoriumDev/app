 Article","q":"Meaning?"},{"t":"Heidelberg","ref":"Q53","q":"Spirit?"},{"t":"Westminster","ref":"Q65","q":"Means of grace?"},{"t":"Baptist","ref":"Q56","q":"Gifts?"}],"christ":"Christ pours out the Holy Spirit upon His Church.","comp":"Every Christian tradition teaches that God's mission continues through His people.","observe":"Why request a double portion?","interpret":"How does God continue His work?","apply":"Encourage future leaders.","pray":"Pray for the next generation.","why":"Elijah's ministry passes to Elisha.","notes":"Double portion refers to the inheritance of a firstborn son."},{"m":8,"d":21,"name":"Healing the Waters","theme":"Restoration","desc":"God heals the polluted spring through Elisha, symbolizing His power to restore what is broken.","cat":"Restoration","tl":"Northern Kingdom","primary":"2 Kings 2:19–22","supp":["Ezekiel 47","Revelation 22:1–2","Psalm 46"],"collect":"Lord, bring healing to every broken place in my life. Amen.","verse":"Revelation 22:2","cc":[{"t":"Catholic","ref":"CCC §§517–521","q":"Christ's healing?"},{"t":"Anglican","ref":"ACNA Q112","q":"Christ's ministry?"},{"t":"Lutheran","ref":"Second Article","q":"Meaning?"},{"t":"Heidelberg","ref":"Q58","q":"Resurrection?"},{"t":"Westminster","ref":"Q1","q":"Comfort?"},{"t":"Baptist","ref":"Q1","q":"Hope?"}],"christ":"Christ brings living water that heals completely.","comp":"Every Christian tradition sees God as the source of restoration.","observe":"Why heal the spring?","interpret":"What does living water symbolize?","apply":"Pray for healing.","pray":"Trust God's restoring power.","why":"First miracle of Elisha.","notes":"Jericho's spring remained important for the city."},{"m":8,"d":22,"name":"The Widow's Oil","theme":"God's Abundant Provision","desc":"God miraculously multiplies oil for a widow in desperate need, demonstrating His compassion for the vulnerable.","cat":"Provision","tl":"Northern Kingdom","primary":"2 Kings 4:1–7","supp":["Philippians 4:19","Luke 6:38","Psalm 23"] y for contentment.","why":"Contrasts faithful and unfaithful service.","notes":"Gehazi's account warns against exploiting ministry for gain."},{"m":8,"d":26,"name":"The Floating Axe Head","theme":"God Cares About Small Things","desc":"Elisha recovers a borrowed axe head, reminding believers that God cares even about ordinary concerns.","cat":"Providence","tl":"Northern Kingdom","primary":"2 Kings 6:1–7","supp":["Matthew 10:29–31","Philippians 4:6","Psalm 121"],"collect":"Father, thank You for caring about every detail of my life. Amen.","verse":"Matthew 10:31","cc":[{"t":"Catholic","ref":"CCC §§301–314","q":"Providence?"},{"t":"Anglican","ref":"ACNA Q18","q":"Providence?"},{"t":"Lutheran","ref":"First Article","q":"Meaning?"},{"t":"Heidelberg","ref":"Q27","q":"Providence?"},{"t":"Westminster","ref":"Q11","q":"Providence?"},{"t":"Baptist","ref":"Q18","q":"Care?"}],"christ":"Christ teaches that the Father knows even the smallest needs.","comp":"Every Christian tradition trusts God's fatherly care.","observe":"Why record this miracle?","interpret":"What does it teach about God?","apply":"Bring every concern to Him.","pray":"Thank God for His care.","why":"A quiet miracle of compassion.","notes":"The borrowed tool represented significant financial value."},{"m":8,"d":27,"name":"Chariots of Fire","theme":"God's Protection","desc":"Elisha's servant learns that God's unseen army surrounds His people.","cat":"Faith","tl":"Northern Kingdom","primary":"2 Kings 6:8–23","supp":["Psalm 91","Romans 8:31","Hebrews 1:14"],"collect":"Lord, open my eyes to trust Your unseen protection. Amen.","verse":"2 Kings 6:16","cc":[{"t":"Catholic","ref":"CCC §§328–336","q":"Angels?"},{"t":"Anglican","ref":"ACNA Q15","q":"God's providence?"},{"t":"Lutheran","ref":"First Article","q":"Meaning?"},{"t":"Heidelberg","ref":"Q26","q":"Providence?"},{"t":"Westminster","ref":"Q11","q":"Providence?"},{"t":"Baptist","ref":"Q18","q":"Care?"}],"christ":"Christ commands the hosts of heaven.","comp":"Every Ch (function(){
const E=Engine,PLAN={};
DATA.plan.forEach((p,i)=>{p.n=i+1;PLAN[p.m+'-'+p.d]=p;});
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const iso=c=>c.y+'-'+p2(c.m)+'-'+p2(c.d);
const link=r=>'https://www.biblegateway.com/passage/?search='+encodeURIComponent(r.replace(/–/g,'-'));
const ref=(r,cls)=>'<a class="read'+(cls?' '+cls:'')+'" href="'+link(r)+'" target="_blank" rel="noopener">'+esc(r)+'</a>';
const real=()=>{const n=new Date();return {y:n.getFullYear(),m:n.getMonth()+1,d:n.getDate()};};
function fromHash(){
  try{const h=location.hash.slice(1),x=/^(\d{4})-(\d{2})-(\d{2})$/.exec(h);
    if(x){const dt=E.mk(+x[1],+x[2],+x[3]);if(dt.getUTCMonth()+1===+x[2])return {y:+x[1],m:+x[2],d:+x[3]};}}catch(e){}
  return null;
}
let cur=fromHash()||real();
const rdKey=c=>'lit-read:'+iso(c);
function isRead(c){try{return localStorage.getItem(rdKey(c))==='1';}catch(e){return false;}}
function setRead(c,v){try{v?localStorage.setItem(rdKey(c),'1'):localStorage.removeItem(rdKey(c));}catch(e){}}
function go(n){const dt=E.add(E.mk(cur.y,cur.m,cur.d),n);cur={y:dt.getUTCFullYear(),m:dt.getUTCMonth()+1,d:dt.getUTCDate()};render();}
function setDate(c){cur=c;render();}
function rel(n){return n===1?'tomorrow':'in '+n+' days';}

function obsCard(o){
  const rd=o.rd||[];
  return '<article class="obs-card"><span class="tag">'+esc(o.type)+'</span><h2>'+esc(o.name)+'</h2>'+
    (o.desc?'<p>'+esc(o.desc)+'</p>':'')+
    (o.time?'<p class="note">Evening observance, '+esc(o.time)+'</p>':'')+
    (rd.length?'<div class="reads">'+rd.map((r,i)=>ref(r,i===0?'main':'')).join('')+'</div>':'')+'</article>';
}

function render(){
  const {y,m,d}=cur,dt=E.mk(y,m,d),dow=dt.getUTCDay();
  const season=E.season(y,m,d);
  document.documentElement.dataset.season=season.id;
  const obs=E.on(y,m,d,DATA.obs);
  const leap=(m===2&&d===29);
  const p=PLAN[leap?'2-28':m+'-'+d];
  const r=real(),isToday=iso(r)===iso(cur);
  const soon=E.upcoming(y,m,d,DATA.obs,5);

  let h='<section class="hero"><div class="num">'+d+'</div><div class="hero-meta"><span class="eyebrow">'+DOW[dow]+'</span>'+
    '<span class="mo">'+MONTHS[m-1]+' '+y+(isToday?'<span class="here">Today</span>':'')+'</span>'+
    '<span class="season">'+esc(season.label)+'</span></div></section>';

  h+='<section class="obs" aria-label="The church year today">';
  if(obs.length){h+=obs.map(obsCard).join('');}
  else{const n=soon[0];h+='<p class="none">No feast or observance today.'+(n?' Next is <strong>'+esc(n.o.name)+'</strong>, '+DS[E.mk(n.y,n.m,n.d).getUTCDay()]+' '+n.d+' '+MS[n.m-1]+' ('+rel(n.days)+').':'')+'</p>';}
  h+='</section>';

  if(p){
    h+='<article class="plan sec"><h3>Daily reading'+(leap?'':' · day '+p.n+' of 365')+'</h3>';

    h+='<h2 class="plan-title">'+esc(p.name)+'</h2>'+(p.theme?'<p class="theme">'+esc(p.theme)+'</p>':'')+
      '<div class="chips">'+[p.cat,p.tl].filter(Boolean).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>'+
      (p.desc?'<p class="lead">'+esc(p.desc)+'</p>':'')+

      '<div class="reads">'+ref(p.primary,'main')+p.supp.map(s=>ref(s)).join('')+'</div>'+

      '<button class="done" id="done" aria-pressed="'+isRead(cur)+'">'+(isRead(cur)?'Marked as read':'Mark as read')+'</button></article>';

    h+='<section class="sec"><h3>Study</h3><dl class="study">'+
      [['Observe',p.observe],['Interpret',p.interpret],['Apply',p.apply],['Pray',p.pray]].filter(x=>x[1]).map(x=>'<div><dt>'+x[0]+'</dt><dd>'+esc(x[1])+'</dd></div>').join('')+'</dl></section>';

    if(p.cc.length) h+='<details><summary>Catechisms, six traditions</summary><div class="det">'+

    const bg=[['Traditional comparison',p.comp],['Why this day',p.why],['Historical notes',p.notes]].filter(x=>x[1]);
    if(bg.length) h+='<details><summary>Background</summary><div class="det">'+bg.map(x=>'<div><h4>'+x[0]+'</h4><p>'+esc(x[1])+'</p></div>').join('')+'</div></details>';
  }else h+='<p class="none">No reading is set for this date.</p>';

  if(soon.length) h+='<section class="sec"><h3>Coming up in the church year</h3><ul class="soon">'+soon.map(s=>
    '<li><span>'+esc(s.o.name)+(s.more?' <span class="note">+'+s.more+' more</span>':'')+'</span><span class="when">'+DS[E.mk(s.y,s.m,s.d).getUTCDay()]+' '+s.d+' '+MS[s.m-1]+(s.y!==y?' '+s.y:'')+' · '+rel(s.days)+'</span></li>').join('')+'</ul></section>';

  document.getElementById('app').innerHTML=h;
  document.getElementById('dp').value=iso(cur);
  const b=document.getElementById('done');
  if(b)b.onclick=()=>{const v=!isRead(cur);setRead(cur,v);b.setAttribute('aria-pressed',v);b.textContent=v?'Marked as read':'Mark as read';};
  try{history.replaceState(null,'','#'+iso(cur));}catch(e){}
}

document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.getElementById('today').onclick=()=>setDate(real());
document.getElementById('dp').onchange=e=>{const x=/^(\d{4})-(\d{2})-(\d{2})$/.exec(e.target.value);if(x)setDate({y:+x[1],m:+x[2],d:+x[3]});};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1);});
window.addEventListener('hashchange',()=>{const c=fromHash();if(c&&iso(c)!==iso(cur))setDate(c);});
render();
})();
</script>

</body></html>
