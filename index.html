<style>
/* Layout: one reading column. Sticky date bar on top, season colour carries the liturgical colour of the day. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#1b2130; --muted:#586074; --line:#d8dce6;
  --on-accent:#ffffff;
  --a-advent:#4b3f9e; --a-christmas:#7a5f10; --a-epiphany:#1b6a73; --a-lent:#7a2e5c;
  --a-holyweek:#8f1d2c; --a-easter:#7a5f10; --a-ordinary:#3f6f3a;
  --accent:var(--a-ordinary);
  --display:'Alegreya',Georgia,'Times New Roman',serif;
  --body:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151d; --surface:#1a1f2a; --ink:#e9ecf3; --muted:#9aa3b6; --line:#2b3243; --on-accent:#12151d;
  --a-advent:#aa9df2; --a-christmas:#e6c35a; --a-epiphany:#6fc9d3; --a-lent:#e592c3;
  --a-holyweek:#f28f9b; --a-easter:#e6c35a; --a-ordinary:#94d08a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1a1f2a; --ink:#e9ecf3; --muted:#9aa3b6; --line:#2b3243; --on-accent:#12151d;
  --a-advent:#aa9df2; --a-christmas:#e6c35a; --a-epiphany:#6fc9d3; --a-lent:#e592c3;
  --a-holyweek:#f28f9b; --a-easter:#e6c35a; --a-ordinary:#94d08a; color-scheme:dark}
:root[data-season="advent"]{--accent:var(--a-advent)}
:root[data-season="christmas"]{--accent:var(--a-christmas)}
:root[data-season="epiphany"]{--accent:var(--a-epiphany)}
:root[data-season="lent"]{--accent:var(--a-lent)}
:root[data-season="holyweek"]{--accent:var(--a-holyweek)}
:root[data-season="easter"]{--accent:var(--a-easter)}
:root[data-season="ordinary"]{--accent:var(--a-ordinary)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.5;margin:0}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--accent)}
.bar-in{max-width:44rem;margin:0 auto;padding:.5rem 1rem;display:flex;gap:.5rem;align-items:center}
.bar button,.bar input{height:2.5rem;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 .75rem;cursor:pointer}
.bar .nav{width:2.5rem;padding:0;font-size:1.25rem;line-height:1}
.bar input{flex:1;min-width:0;text-align:center;font-variant-numeric:tabular-nums}
.bar .today{font-weight:700;color:var(--accent)}
.bar button:hover{border-color:var(--accent)}

main{max-width:44rem;margin:0 auto;padding-inline:1rem;padding-block:1.5rem 3rem;display:flex;flex-direction:column;gap:1.75rem}
h1,h2,h3,p,dl,dd,ul,blockquote{margin:0}
.eyebrow{font-size:.8125rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}

.hero{display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap}
.num{font-family:var(--display);font-weight:700;font-size:clamp(4rem,19vw,6rem);line-height:.85;color:var(--accent);font-variant-numeric:lining-nums}
.hero-meta{display:flex;flex-direction:column;gap:.25rem;min-width:0;padding-bottom:.2rem}
.hero-meta .mo{font-family:var(--display);font-size:1.5rem;font-weight:500;line-height:1.1}
.season{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;color:var(--accent)}
.season::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:var(--accent)}
.here{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--on-accent);background:var(--accent);padding:.05rem .45rem;border-radius:4px;margin-left:.5rem}

.obs{display:flex;flex-direction:column;gap:1rem}
.obs-card{background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:10px;padding:1rem 1.125rem;display:flex;flex-direction:column;gap:.5rem}
.obs-card h2{font-family:var(--display);font-size:1.75rem;line-height:1.15;font-weight:700;text-wrap:balance}
.tag{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.none{color:var(--muted)}
.none strong{color:var(--ink);font-weight:500}

.sec{display:flex;flex-direction:column;gap:.75rem}
.sec>h3{font-size:.8125rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-bottom:.25rem;border-bottom:1px solid var(--line)}
.plan-title{font-family:var(--display);font-size:2rem;line-height:1.12;font-weight:700;text-wrap:balance}
.theme{font-family:var(--display);font-style:italic;font-size:1.25rem;color:var(--muted)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{font-size:.8125rem;border:1px solid var(--line);border-radius:999px;padding:.05rem .65rem;color:var(--muted)}
.lead{max-width:65ch}
.christ{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.875rem 1rem;max-width:65ch}
.christ .tag{display:block;margin-bottom:.25rem}

.reads{display:flex;gap:.5rem;flex-wrap:wrap}
.read{display:inline-block;text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.3rem .7rem;min-height:2.25rem;font-variant-numeric:lining-nums}
.read:hover{border-color:var(--accent)}
.read.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;font-size:1.125rem}
.verse{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap;color:var(--muted)}
.verse a{color:var(--ink);font-weight:700}
.collect{font-family:var(--display);font-style:italic;font-size:1.3rem;line-height:1.4;max-width:60ch;padding-inline-start:1rem;border-inline-start:2px solid var(--line)}

dl.study{display:grid;grid-template-columns:1fr;gap:.9rem}
dl.study div{display:flex;flex-direction:column;gap:.1rem}
dt{font-weight:700;color:var(--accent);font-size:.9rem;letter-spacing:.06em;text-transform:uppercase}
dd{max-width:65ch}

details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
summary{cursor:pointer;padding:.75rem 1rem;font-weight:700;min-height:2.75rem;display:flex;align-items:center}
details[open]>summary{border-bottom:1px solid var(--line)}
.det{padding:.875rem 1rem;display:flex;flex-direction:column;gap:.9rem}
.det h4{margin:0;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cc{display:flex;flex-direction:column;gap:.1rem}
.cc b{font-variant-numeric:lining-nums}
.cc span{color:var(--muted)}

.done{align-self:flex-start;height:2.75rem;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:0 1.1rem;font-weight:700;cursor:pointer}
.done[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

ul.soon{list-style:none;padding:0;display:flex;flex-direction:column}
ul.soon li{display:flex;gap:.75rem;justify-content:space-between;align-items:baseline;padding:.55rem 0;border-bottom:1px solid var(--line)}
ul.soon li>span:first-child{min-width:0}
ul.soon .when{color:var(--muted);font-size:.9rem;white-space:nowrap;font-variant-numeric:lining-nums}
.note{font-size:.9rem;color:var(--muted)}
@media (min-width:40rem){dl.study{grid-template-columns:1fr 1fr;gap:1.1rem 1.5rem}}
@media (prefers-reduced-motion:no-preference){.obs-card,.plan{animation:rise .35s ease-out both}@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

  <button class="nav" id="prev" aria-label="Previous day">&lsaquo;</button>
  <input type="date" id="dp" aria-label="Choose a date">

</div></header>

<script>
const Engine=(function(){
const DAY=86400000;
const mk=(y,m,d)=>new Date(Date.UTC(y,m-1,d));
const add=(dt,n)=>new Date(dt.getTime()+n*DAY);
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),
  g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,
  m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),dy=((h+l-7*m+114)%31)+1;
  return mk(y,mo,dy);
}
function advent(y){
  const x=mk(y,12,25),dow=x.getUTCDay();
  return add(add(x,dow===0?-7:-dow),-21);
}
function resolve(o,y){
  switch(o.kind){
    case 'FIXED': return mk(y,o.month,o.day);
    case 'EASTER_OFFSET': return add(easter(y),o.offset);
    case 'EPIPHANY_OFFSET': return add(mk(y,1,6),o.offset);
    case 'ASH_OFFSET': return add(add(easter(y),-46),o.offset);
    case 'PENTECOST_OFFSET': return add(add(easter(y),49),o.offset);
    case 'PRE_ADVENT': return add(advent(y),-7);
    case 'ADVENT': return add(advent(y),o.offset);
  }
  throw new Error('kind '+o.kind);
}
const RANK={Feast:0,Day:1,Commemoration:2,Season:3};
const keyOf=dt=>(dt.getUTCMonth()+1)+'-'+dt.getUTCDate();
const memo={};
function yearMap(y,OBS){
  if(memo[y]) return memo[y];
  const map={};
  OBS.forEach((o,i)=>{const k=keyOf(resolve(o,y));(map[k]=map[k]||[]).push({o,i});});
  Object.values(map).forEach(a=>a.sort((p,q)=>RANK[p.o.type]-RANK[q.o.type]||p.i-q.i));
  return memo[y]=map;
}
const SEASONS={advent:'Advent',christmas:'Christmas',epiphany:'Epiphany',lent:'Lent',holyweek:'Holy Week',easter:'Eastertide',ordinary:'Ordinary Time'};
function season(y,m,d){
  const t=mk(y,m,d).getTime(),ea=easter(y),ash=add(ea,-46).getTime(),palm=add(ea,-7).getTime(),
  pent=add(ea,49).getTime(),adv=advent(y).getTime();
  let id;
  if(t>=adv) id=t<=mk(y,12,24).getTime()?'advent':'christmas';
  else if(t<mk(y,1,6).getTime()) id='christmas';
  else if(t<ash) id='epiphany';
  else if(t<palm) id='lent';
  else if(t<ea.getTime()) id='holyweek';
  else if(t<=pent) id='easter';
  else id='ordinary';
  return {id,label:SEASONS[id]};
}
function on(y,m,d,OBS){return (yearMap(y,OBS)[m+'-'+d]||[]).map(x=>x.o);}
function upcoming(y,m,d,OBS,n){
  const out=[];let dt=mk(y,m,d);
  for(let i=1;i<=400&&out.length<n;i++){
    dt=add(dt,1);
    const list=on(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate(),OBS);
    if(list.length) out.push({days:i,y:dt.getUTCFullYear(),m:dt.getUTCMonth()+1,d:dt.getUTCDate(),o:list[0],more:list.length-1});
  }
  return out;
}
return {mk,add,easter,advent,on,season,upcoming,keyOf,SEASONS};
})();
if(typeof module!=='undefined') module.exports=Engine;

</script>

t?","interpret":"Why does God establish covenants?","apply":"How can I rely on God's promises?","pray":"Praise God for his faithfulness.","why":"Introduces the biblical covenant theme.","notes":"The Noahic Covenant extends to all creation, not only Israel."},{"m":1,"d":9,"name":"Babel","theme":"Pride and Division","desc":"Humanity seeks its own glory,n resulting in confusion, scattering, and the birth of nations.","cat":"Scripture Study","tl":"Primeval History","primary":"Genesis 11","supp":["Acts 2:1–12","Philippians 2:1–11","Psalm 33"],"collect":"Lord, keep me humble and devoted to Your glory.","verse":"Genesis 11:9","cc":[{"t":"Catholic","ref":"CCC §§56-58","q":"Why did humanity scatter?"},{"t":"Anglican","ref":"ACNA Q74","q":"What is pride?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q94","q":"Idolatry"},{"t":"Westminster","ref":"Q50","q":"Sin"},{"t":"Baptist","ref":"Q49","q":"Sin"}],"christ":"Pentecost reverses Babel as the Holy Spirit unites believers from every nation.","comp":"Pride divides humanity. Christ unites His church.","observe":"What motivated Babel?","interpret":"Why does pride separate people from God?","apply":"Where do I struggle with pride?","pray":"Pray for humility.","why":"Concludes Primeval History.","notes":"Babel explains the diversity of languages within the biblical narrative."},{"m":1,"d":10,"name":"The Call of Abram","theme":"Faith and Promise","desc":"God calls Abram to leave everything behind and trust His covenant promises.","cat":"Covenant","tl":"Patriarchs","primary":"Genesis 12","supp":["Galatians 3:6–9","Hebrews 11:8–10","Psalm 105"],"collect":"Lord, give me faith to follow wherever You lead.","verse":"Genesis 12:2","cc":[{"t":"Catholic","ref":"CCC §§59-61","q":"Why did God choose Abraham?"},{"t":"Anglican","ref":"ACNA Q46-48","q":"What is God's covenant?"},{"t":"Lutheran","ref":"First Article","q":"How does God call His people?"},{"t":"Heidelberg","ref":"Q19","q":"God's promises"},{"t":"Westminster","ref":"Q31","q":"Covenant of Grace"},{"t":"Baptist","ref":"Q23","q":"Covenant promises"}],"christ":"Jesus fulfills God's promise that all nations would be blessed through Abraham.","comp":"Every Christian tradition honors Abraham as the father of the faithful, though covenant theology is understood differently.","observe":"What did Abraham leave behind?","interpret":"Why did God choose Abram?","apply":"What is God calling me to trust Him with?","pray":"Ask God for obedient faith.","why":"Begins the story of God's covenant people.","notes":"Abraham stands at the center of salvation history and the unfolding plan of redemption."},{"m":1,"d":11,"name":"God's Covenant Confirmed","theme":"God's Faithfulness","desc":"God formally establishes His covenant with Abram, promising descendants, land, and blessing despite impossible circumstances.","cat":"Covenant","tl":"Patriarchs","primary":"Genesis 15","supp":["Romans 4:18–25","Galatians 3:15–18","Psalm 27"],"collect":"Faithful Lord, strengthen my trust in Your promises. Amen.","verse":"Genesis 15:6","cc":[{"t":"Catholic","ref":"CCC §§59–61","q":"What is God's covenant with Abraham?"},{"t":"Anglican","ref":"ACNA Q46–48","q":"Why does God make covenants?"},{"t":"Lutheran","ref":"First Article","q":"How does God keep His promises?"},{"t":"Heidelberg","ref":"Q26","q":"What is God's providence?"},{"t":"Westminster","ref":"Q20","q":"Did God leave all mankind to perish?"},{"t":"Baptist","ref":"Q23","q":"What covenant did God establish?"}],"christ":"God's covenant finds its fulfillment in Christ, the promised offspring of Abraham.","comp":"All traditions recognize Abraham as the father of faith while explaining covenant theology differently.","observe":"Why did Abram believe?","interpret":"Why is faith counted as righteousness?","apply":"Where do I need greater trust?","pray":"Thank God for His faithfulness.","why":"Establishes the covenant that shapes the remainder of Scripture.","notes":"Ancient covenants often included solemn ceremonies like Genesis 15."},{"m":1,"d":12,"name":"Waiting on God's Timing","theme":"Human Impatience","desc":"Sarai and Abram attempt to fulfill God's promise through Hagar, demonstrating the danger of relying on human solutions.","cat":"Christian Living","tl":"Patriarchs","primary":"Genesis 16","supp":["Galatians 4:21–31","Psalm 130","James 1:2–4"],"collect":"Lord, teach me patience while waiting on Your perfect timing.","verse":"Psalm 130:5","cc":[{"t":"Catholic","ref":"CCC §§1817–1821","q":"What is hope?"},{"t":"Anglican","ref":"ACNA Q98–101","q":"What is Christian hope?"},{"t":"Lutheran","ref":"First Commandment","q":"What does trusting God mean?"},{"t":"Heidelberg","ref":"Q28","q":"What comfort comes from providence?"},{"t":"Westminster","ref":"Q21","q":"Who is the Redeemer?"},{"t":"Baptist","ref":"Q24","q":"Why must we trust God?"}],"christ":"Christ fulfills God's promises without human striving.","comp":"Every tradition teaches dependence upon God's timing rather than human effort.","observe":"What mistake did Abram and Sarai make?","interpret":"Why is waiting difficult?","apply":"Where am I trying to rush God?","pray":"Pray for patience.","why":"Shows that even faithful believers struggle with doubt.","notes":"Ishmael's birth has lasting significance throughout biblical history."},{"m":1,"d":13,"name":"The Covenant Sign","theme":"Belonging to God","desc":"God gives circumcision as the sign of His covenant and renames Abram and Sarai as Abraham and Sarah.","cat":"Covenant","tl":"Patriarchs","primary":"Genesis 17","supp":["Romans 4:9–12","Colossians 2:11–12","Psalm 103"],"collect":"Lord, remind me that I belong to You.","verse":"Genesis 17:7","cc":[{"t":"Catholic","ref":"CCC §§527, 1150","q":"Why did God give covenant signs?"},{"t":"Anglican","ref":"ACNA Q121–126","q":"What does Baptism signify?"},{"t":"Lutheran","ref":"Baptism","q":"What blessings does Baptism give?"},{"t":"Heidelberg","ref":"Q69–74","q":"Why Baptism?"},{"t":"Westminster","ref":"Q94–95","q":"What do the sacraments teach?"},{"t":"Baptist","ref":"Q92–97","q":"What does Baptism signify?"}],"christ":"Circumcision points forward to the inward transformation accomplished through Christ.","comp":"Traditions differ on covenant signs but agree they point to God's promises.","observe":"Why did God change Abram's name?","interpret":"Why do covenant signs matter?","apply":"How do I live as one set apart?","pray":"Thank God for making you His own.","why":"Introduces the covenant sign before Isaac's birth.","notes":"Name changes in Scripture often signify divine calling."},{"m":1,"d":14,"name":"Nothing Is Impossible","theme":"Trusting God's Promise","desc":"Three visitors announce Isaac's coming birth, reminding Abraham that nothing is impossible for God.","cat":"Faith","tl":"Patriarchs","primary":"Genesis 18","supp":["Luke 1:26–38","Hebrews 13:2","Psalm 145"],"collect":"Almighty God, strengthen my faith in Your promises.","verse":"Genesis 18:14","cc":[{"t":"Catholic","ref":"CCC §§268–278","q":"Is anything impossible for God?"},{"t":"Anglican","ref":"ACNA Q14","q":"Who is God?"},{"t":"Lutheran","ref":"First Article","q":"What does God's power mean?"},{"t":"Heidelberg","ref":"Q26","q":"What do you believe about God?"},{"t":"Westminster","ref":"Q4","q":"What is God?"},{"t":"Baptist","ref":"Q9","q":"What are God's works?"}],"christ":"Isaac's miraculous birth foreshadows the miraculous birth of Christ.","comp":"All traditions affirm God's omnipotence and faithfulness.","observe":"Why did Sarah laugh?","interpret":"What does God's question reveal?","apply":"What promise seems impossible to me?","pray":"Trust God's power.","why":"Reinforces God's sovereignty before judgment falls on Sodom.","notes":"Hospitality shown to strangers became a model of biblical faithfulness."},{"m":1,"d":15,"name":"Justice and Mercy","theme":"The Lord Judges","desc":"God judges Sodom while rescuing Lot, revealing both His justice and mercy.","cat":"Scripture Study","tl":"Patriarchs","primary":"Genesis 19","supp":["2 Peter 2:6–9","Jude 7","Psalm 11"],"collect":"Holy God, help me flee from sin and trust Your mercy.","verse":"Genesis 18:25","cc":[{"t":"Catholic","ref":"CCC §§1038–1041","q":"How will God judge humanity?"},{"t":"Anglican","ref":"ACNA Q99","q":"Why should we fear God?"},{"t":"Lutheran","ref":"Second Petition","q":"What does God's kingdom do?"},{"t":"Heidelberg","ref":"Q52","q":"What comfort comes from Christ's return?"},{"t":"Westminster","ref":"Q38","q":"What benefits does Christ give?"},{"t":"Baptist","ref":"Q41","q":"What will Christ do when He returns?"}],"christ":"Christ rescues believers from final judgment.","comp":"Every tradition affirms God's justice tempered by mercy.","observe":"What was Sodom's greatest sin?","interpret":"Why did Lot hesitate?","apply":"Am I compromising with sin?","pray":"Ask for courage to pursue holiness.","why":"Demonstrates the seriousness of persistent rebellion.","notes":"Sodom became a biblical symbol of divine judgment."},{"m":1,"d":16,"name":"Faith Despite Failure","theme":"Abraham and Abimelech","desc":"Even God's chosen servants fail, yet His covenant remains secure because of His faithfulness.","cat":"Character Study","tl":"Patriarchs","primary":"Genesis 20","supp":["Romans 3:23–24","Psalm 32","2 Timothy 2:13"],"collect":"Merciful Father, thank You for Your faithfulness when I fail.","verse":"2 Timothy 2:13","cc":[{"t":"Catholic","ref":"CCC §§1422–1498","q":"Why do believers need forgiveness?"},{"t":"Anglican","ref":"ACNA Q127–134","q":"What is repentance?"},{"t":"Lutheran","ref":"Confession","q":"What is confession?"},{"t":"Heidelberg","ref":"Q56","q":"What do you believe about forgiveness?"},{"t":"Westminster","ref":"Q33","q":"What is justification?"},{"t":"Baptist","ref":"Q35","q":"What benefits come through Christ?"}],"christ":"Christ remains faithful despite our failures.","comp":"Every tradition teaches that salvation rests on God's grace.","observe":"How did Abraham fail?","interpret":"Why didn't God abandon him?","apply":"How should failure shape humility?","pray":"Thank God for His forgiveness.","why":"Demonstrates God's faithfulness over human perfection.","notes":"Even patriarchs required God's continual grace."},{"m":1,"d":17,"name":"The Child of Promise","theme":"Isaac Is Born","desc":"God's long-awaited promise is fulfilled through Isaac's birth.","cat":"Promise","tl":"Patriarchs","primary":"Genesis 21","supp":["Galatians 4:28","Hebrews 11:11","Psalm 113"],"collect":"Faithful God, thank You for keeping every promise.","verse":"Genesis 21:2","cc":[{"t":"Catholic","ref":"CCC §§706, 2570","q":"Why is Isaac important?"},{"t":"Anglican","ref":"ACNA Q46","q":"Why did God choose Abraham?"},{"t":"Lutheran","ref":"First Article","q":"What gifts has God given?"},{"t":"Heidelberg","ref":"Q35","q":"What comfort comes from Christ?"},{"t":"Westminster","ref":"Q31","q":"Covenant of Grace"},{"t":"Baptist","ref":"Q23","q":"God's covenant promises"}],"christ":"Isaac foreshadows Christ, the promised Son.","comp":"Isaac is central to every Christian understanding of God's covenant.","observe":"Why did Isaac's birth matter?","interpret":"Why wait so long?","apply":"How has God been faithful in my life?","pray":"Offer thanks for answered prayers.","why":"Culminates years of waiting upon God's promise.","notes":"Isaac's name means \"he laughs.\""},{"m":1,"d":18,"name":"Tested Faith","theme":"Abraham Offers Isaac","desc":"Abraham's willingness to offer Isaac demonstrates radical faith and trust in God.","cat":"Faith","tl":"Patriarchs","primary":"Genesis 22","supp":["Hebrews 11:17–19","James 2:21–24","Psalm 16"],"collect":"Lord, help me trust You completely.","verse":"Genesis 22:8","cc":[{"t":"Catholic","ref":"CCC §§2572–2573","q":"What does Abraham teach about faith?"},{"t":"Anglican","ref":"ACNA Q103","q":"What is saving faith?"},{"t":"Lutheran","ref":"First Commandment","q":"What is trusting God?"},{"t":"Heidelberg","ref":"Q21","q":"True faith"},{"t":"Westminster","ref":"Q86","q":"Why do good works?"},{"t":"Baptist","ref":"Q39","q":"How do believers obey God?"}],"christ":"Isaac carrying the wood up the mountain foreshadows Christ carrying His cross.","comp":"Every Christian tradition sees Genesis 22 as one of Scripture's clearest pictures of Christ.","observe":"What was Abraham willing to surrender?","interpret":"Why test faith?","apply":"What am I unwilling to give God?","pray":"Pray for complete trust.","why":"One of the Bible's greatest demonstrations of faith.","notes":"Mount Moriah later became closely associated with Jerusalem and the Temple."},{"m":1,"d":19,"name":"A Bride for Isaac","theme":"God's Providence","desc":"God providentially guides Abraham's servant to Rebekah.","cat":"Providence","tl":"Patriarchs","primary":"Genesis 24","supp":["Proverbs 3:5–6","Ephesians 5:25–32","Psalm 37"],"collect":"Lord, guide my steps according to Your will.","verse":"Proverbs 3:5–6","cc":[{"t":"Catholic","ref":"CCC §§302–314","q":"What is Divine Providence?"},{"t":"Anglican","ref":"ACNA Q18","q":"How does God govern creation?"},{"t":"Lutheran","ref":"First Article","q":"How does God care for us?"},{"t":"Heidelberg","ref":"Q27–28","q":"Providence"},{"t":"Westminster","ref":"Q11","q":"Providence"},{"t":"Baptist","ref":"Q18","q":"God's government of creation"}],"christ":"Isaac and Rebekah reflect Christ's love for His Church.","comp":"All traditions affirm God's providential guidance.","observe":"How did God answer prayer?","interpret":"What is providence?","apply":"Do I trust God's guidance?","pray":"Ask God to direct your path.","why":"Shows God working through ordinary events.","notes":"Ancient marriage customs emphasize covenant and family."},{"m":1,"d":20,"name":"Passing the Promise","theme":"Isaac Blesses Jacob","desc":"God's covenant continues through imperfect people according to His sovereign plan.","cat":"Covenant","tl":"Patriarchs","primary":"Genesis 25","supp":["Romans 9:10–16","Hebrews 12:16–17","Psalm 25"],"collect":"Sovereign Lord, accomplish Your will in my life.","verse":"Romans 9:16","cc":[{"t":"Catholic","ref":"CCC §§600–605","q":"How does God's plan unfold?"},{"t":"Anglican","ref":"ACNA Q16","q":"What is God's purpose?"},{"t":"Lutheran","ref":"First Article","q":"What does God's providence accomplish?"},{"t":"Heidelberg","ref":"Q26","q":"Providence"},{"t":"Westminster","ref":"Q7","q":"God's decrees"},{"t":"Baptist","ref":"Q10","q":"God's eternal purpose"}],"christ":"Christ is the ultimate heir of the covenant promises.","comp":"Traditions differ in explaining election but affirm God's sovereign faithfulness.","observe":"What made Esau's choice tragic?","interpret":"Why does God choose as He wills?","apply":"Do I value spiritual blessings?","pray":"Pray for wisdom and faithfulness.","why":"Introduces Jacob, through whom the covenant line continues.","notes":"Genesis increasingly focuses on God's covenant family rather than the surrounding nations."},{"m":1,"d":21,"name":"Jacob's Dream","theme":"God's Presence","desc":"God reassures Jacob at Bethel that His covenant remains secure despite Jacob's uncertainty.","cat":"Covenant","tl":"Patriarchs","primary":"Genesis 28","supp":["John 1:43–51","Psalm 121","Hebrews 13:5"],"collect":"Lord, help me trust that You are always with me.","verse":"Genesis 28:15","cc":[{"t":"Catholic","ref":"CCC §§2571–2573","q":"How does God remain faithful?"},{"t":"Anglican","ref":"ACNA Q18","q":"How does God care for His people?"},{"t":"Lutheran","ref":"First Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q26","q":"Providence"},{"t":"Westminster","ref":"Q11","q":"God's works of providence"},{"t":"Baptist","ref":"Q18","q":"God's government"}],"christ":"Jesus identifies Himself as the true ladder between heaven and earth (John 1:51).","comp":"All traditions affirm God's continual presence with His people.","observe":"Why did Jacob fear?","interpret":"Why did God appear?","apply":"Where do I need God's assurance?","pray":"Thank God for His presence.","why":"God's covenant follows Jacob into exile.","notes":"Bethel became one of Israel's most significant worship sites."},{"m":1,"d":22,"name":"Wrestling with God","theme":"Transformation","desc":"Jacob wrestles through the night and receives a new name: Israel.","cat":"Character Study","tl":"Patriarchs","primary":"Genesis 32","supp":["Hosea 12:3–6","James 1:2–4","Psalm 63"],"collect":"Lord, transform my heart through every trial.","verse":"Genesis 32:28","cc":[{"t":"Catholic","ref":"CCC §§2725–2745","q":"Why should we persevere in prayer?"},{"t":"Anglican","ref":"ACNA Q141","q":"Why pray continually?"},{"t":"Lutheran","ref":"Lord's Prayer","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q116","q":"Why must Christians pray?"},{"t":"Westminster","ref":"Q98","q":"What is prayer?"},{"t":"Baptist","ref":"Q107","q":"Why must we pray?"}],"christ":"Jacob's transformation points to the new identity believers receive in Christ.","comp":"Every tradition values perseverance in faith and prayer.","observe":"Why did Jacob refuse to let go?","interpret":"What changed that night?","apply":"Where is God changing me?","pray":"Pray for perseverance.","why":"Marks Jacob's spiritual turning point.","notes":"The name \"Israel\" means \"he struggles with God\" or \"God prevails.\""},{"m":1,"d":23,"name":"Reconciliation","theme":"Forgiveness Restored","desc":"Jacob and Esau reconcile after years of bitterness and fear.","cat":"Christian Living","tl":"Patriarchs","primary":"Genesis 33","supp":["Matthew 5:23–24","Romans 12:18","Psalm 133"],"collect":"God of peace, teach me to forgive as You forgive.","verse":"Romans 12:18","cc":[{"t":"Catholic","ref":"CCC §§2838–2845","q":"Why must we forgive?"},{"t":"Anglican","ref":"ACNA Q136","q":"Why forgive others?"},{"t":"Lutheran","ref":"Fifth Petition","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q126","q":"Forgiveness"},{"t":"Westminster","ref":"Q105","q":"Duties toward neighbor"},{"t":"Baptist","ref":"Q81","q":"Forgiveness"}],"christ":"Christ reconciles sinners to God and calls believers to reconciliation.","comp":"Forgiveness is essential in every Christian tradition.","observe":"Why did Esau forgive?","interpret":"What heals broken relationships?","apply":"Is there someone I should reconcile with?","pray":"Pray for a forgiving spirit.","why":"Shows healing within God's covenant family.","notes":"Ancient reconciliations often restored family inheritance and honor."},{"m":1,"d":24,"name":"A Family in Need of Grace","theme":"Brokenness and Mercy","desc":"The sins of Jacob's family reveal humanity's continuing need for God's grace.","cat":"Scripture Study","tl":"Genesis","primary":"Genesis 34–35","supp":["Romans 3:23","Psalm 103","Micah 6:8"],"collect":"Merciful Father, renew my heart in holiness.","verse":"Micah 6:8","cc":[{"t":"Catholic","ref":"CCC §§1846–1848","q":"Why do we need mercy?"},{"t":"Anglican","ref":"ACNA Q127","q":"What is repentance?"},{"t":"Lutheran","ref":"Confession","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q56","q":"Forgiveness"},{"t":"Westminster","ref":"Q87","q":"Repentance"},{"t":"Baptist","ref":"Q87","q":"Repentance"}],"christ":"Christ redeems broken families and restores sinners.","comp":"God's grace works despite human failures.","observe":"What failures stand out?","interpret":"Why does God remain faithful?","apply":"Where do I need repentance?","pray":"Pray for a renewed heart.","why":"Demonstrates that God's covenant depends upon His faithfulness.","notes":"Genesis never hides the flaws of its heroes."},{"m":1,"d":25,"name":"Joseph's Dreams","theme":"God's Sovereign Plan","desc":"Joseph receives dreams that foreshadow God's greater purposes despite family conflict.","cat":"Character Study","tl":"Patriarchs","primary":"Genesis 37","supp":["Romans 8:28","Acts 7:9–10","Psalm 105"],"collect":"Lord, help me trust Your unseen plans.","verse":"Genesis 37:5","cc":[{"t":"Catholic","ref":"CCC §§302–314","q":"What is Divine Providence?"},{"t":"Anglican","ref":"ACNA Q18","q":"How does God govern creation?"},{"t":"Lutheran","ref":"First Article","q":"Providence"},{"t":"Heidelberg","ref":"Q27","q":"Providence"},{"t":"Westminster","ref":"Q11","q":"Providence"},{"t":"Baptist","ref":"Q18","q":"Providence"}],"christ":"Joseph foreshadows Christ, who is rejected by His own yet becomes their savior.","comp":"God's providence is universally affirmed.","observe":"Why were Joseph's brothers jealous?","interpret":"How can God use suffering?","apply":"Will I trust God's plan?","pray":"Ask for patience in trials.","why":"Begins Joseph's story.","notes":"Joseph's life forms the bridge between the Patriarchs and Exodus."},{"m":1,"d":26,"name":"Faith in Adversity","theme":"Joseph in Egypt","desc":"Joseph remains faithful despite betrayal, slavery, and injustice.","cat":"Christian Living","tl":"Patriarchs","primary":"Genesis 39","supp":["1 Peter 2:19–23","Philippians 4:11–13","Psalm 40"],"collect":"Lord, help me remain faithful in every circumstance.","verse":"Genesis 39:2","cc":[{"t":"Catholic","ref":"CCC §§1803–1845","q":"What is virtue?"},{"t":"Anglican","ref":"ACNA Q104","q":"How should Christians live?"},{"t":"Lutheran","ref":"Ten Commandments","q":"Christian life"},{"t":"Heidelberg","ref":"Q86","q":"Gratitude"},{"t":"Westminster","ref":"Q35","q":"Sanctification"},{"t":"Baptist","ref":"Q90","q":"Obedience"}],"christ":"Christ remained faithful under unjust suffering.","comp":"Faithfulness under trial is central to Christian discipleship.","observe":"What kept Joseph faithful?","interpret":"How does God strengthen us?","apply":"How do I respond to hardship?","pray":"Pray for endurance.","why":"Continues Joseph's formation.","notes":"Joseph's integrity contrasts with surrounding corruption."},{"m":1,"d":27,"name":"Wisdom from God","theme":"Interpreting Dreams","desc":"God grants Joseph wisdom that prepares him to save many lives.","cat":"Wisdom","tl":"Patriarchs","primary":"Genesis 40–41","supp":["James 1:5","Daniel 2:20–23","Proverbs 2"],"collect":"God of wisdom, guide my thoughts and decisions.","verse":"James 1:5","cc":[{"t":"Catholic","ref":"CCC §§1830–1832","q":"What are the gifts of the Holy Spirit?"},{"t":"Anglican","ref":"ACNA Q67","q":"How does God guide us?"},{"t":"Lutheran","ref":"Third Article","q":"The Holy Spirit"},{"t":"Heidelberg","ref":"Q53","q":"Holy Spirit"},{"t":"Westminster","ref":"Q36","q":"Benefits of Christ"},{"t":"Baptist","ref":"Q39","q":"Spirit's work"}],"christ":"Joseph's wisdom foreshadows Christ's perfect wisdom.","comp":"Every tradition teaches that wisdom is God's gift.","observe":"Why did Joseph succeed?","interpret":"Where does wisdom come from?","apply":"Do I seek God's wisdom first?","pray":"Ask God for discernment.","why":"Joseph rises from prison to leadership.","notes":"Egypt depended heavily upon wise administrators during famine."},{"m":1,"d":28,"name":"Forgiveness Over Revenge","theme":"Joseph Meets His Brothers","desc":"Joseph tests his brothers before extending forgiveness and mercy.","cat":"Forgiveness","tl":"Patriarchs","primary":"Genesis 42–45","supp":["Luke 15","Ephesians 4:32","Psalm 103"],"collect":"Lord, make me quick to forgive.","verse":"Genesis 45:5","cc":[{"t":"Catholic","ref":"CCC §§2840–2845","q":"Why forgive?"},{"t":"Anglican","ref":"ACNA Q136","q":"What is forgiveness?"},{"t":"Lutheran","ref":"Fifth Petition","q":"Forgiveness"},{"t":"Heidelberg","ref":"Q126","q":"Forgiveness"},{"t":"Westminster","ref":"Q105","q":"Duties to neighbor"},{"t":"Baptist","ref":"Q81","q":"Forgiveness"}],"christ":"Joseph reflects Christ's forgiveness toward those who wronged Him.","comp":"Mercy triumphs over vengeance in every tradition.","observe":"Why did Joseph forgive?","interpret":"What changed his brothers?","apply":"Whom do I need to forgive?","pray":"Pray for mercy.","why":"Culminates Joseph's reconciliation.","notes":"Joseph's words become one of Genesis' greatest statements of providence."},{"m":1,"d":29,"name":"God Meant It for Good","theme":"Providence in Suffering","desc":"God sovereignly works through evil intentions to accomplish His saving purposes.","cat":"Doctrine","tl":"Patriarchs","primary":"Genesis 50","supp":["Romans 8:28","Acts 2:23","Psalm 46"],"collect":"Sovereign Lord, help me trust You in every circumstance.","verse":"Genesis 50:20","cc":[{"t":"Catholic","ref":"CCC §§302–314","q":"How does God bring good from evil?"},{"t":"Anglican","ref":"ACNA Q18","q":"Providence"},{"t":"Lutheran","ref":"First Article","q":"Providence"},{"t":"Heidelberg","ref":"Q28","q":"Providence"},{"t":"Westminster","ref":"Q11","q":"Providence"},{"t":"Baptist","ref":"Q18","q":"Providence"}],"christ":"Christ's crucifixion is the supreme example of God bringing salvation through evil.","comp":"All traditions affirm God's sovereign providence while explaining it differently.","observe":"What does Joseph's statement teach?","interpret":"Can God redeem suffering?","apply":"Where do I need hope?","pray":"Thank God for His providence.","why":"Concludes Genesis.","notes":"Genesis ends looking toward future redemption in Exodus."},{"m":1,"d":30,"name":"God's Deliverer","theme":"The Birth of Moses","desc":"God prepares Israel's future deliverer during a time of oppression.","cat":"Character Study","tl":"Exodus","primary":"Exodus 1–2","supp":["Hebrews 11:23","Acts 7:17–22","Psalm 90"],"collect":"Lord, raise up faithful servants in every generation.","verse":"Exodus 2:10","cc":[{"t":"Catholic","ref":"CCC §§2574–2577","q":"Why is Moses important?"},{"t":"Anglican","ref":"ACNA Q46","q":"God's covenant people"},{"t":"Lutheran","ref":"First Article","q":"God's care"},{"t":"Heidelberg","ref":"Q26","q":"Providence"},{"t":"Westminster","ref":"Q20","q":"Redemption"},{"t":"Baptist","ref":"Q23","q":"God's covenant"}],"christ":"Moses foreshadows Christ as the greater Deliverer.","comp":"Moses is honored across Christian traditions as God's chosen servant.","observe":"Why preserve Moses?","interpret":"What is God preparing?","apply":"How might God prepare me?","pray":"Pray for faithful leadership.","why":"Introduces the Exodus story.","notes":"Moses' rescue parallels later biblical deliverance narratives."},{"m":1,"d":31,"name":"The Burning Bush","theme":"God Calls His Servants","desc":"God reveals His holy name and commissions Moses to lead Israel from bondage.","cat":"Calling","tl":"Exodus","primary":"Exodus 3–4","supp":["John 8:58","Hebrews 11:24–27","Psalm 99"],"collect":"Holy God, give me courage to answer Your call.","verse":"Exodus 3:14","cc":[{"t":"Catholic","ref":"CCC §§203–231","q":"What is God's name?"},{"t":"Anglican","ref":"ACNA Q14","q":"Who is God?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q25–28","q":"Providence"},{"t":"Westminster","ref":"Q4","q":"What is God?"},{"t":"Baptist","ref":"Q9","q":"God's being"}],"christ":"Jesus' declaration \"I AM\" identifies Him with the God who spoke from the burning bush.","comp":"All traditions recognize God's self-revelation as foundational to Christian theology.","observe":"Why did Moses hesitate?","interpret":"What does \"I AM\" reveal?","apply":"How is God calling me today?","pray":"Pray for courage and obedience.","why":"Opens the Exodus mission that will define Israel's identity.","notes":"God's divine name, revealed here, became central to Jewish and Christian understanding of His eternal nature."},{"m":2,"d":1,"name":"Moses Before Pharaoh","theme":"Obedience Despite Opposition","desc":"Moses and Aaron confront Pharaoh with God's command, but Pharaoh hardens his heart and increases Israel's suffering. God's servants learn that obedience often brings opposition before deliverance.","cat":"Scripture Study","tl":"Exodus","primary":"Exodus 5–6","supp":["Hebrews 11:24–27","Romans 8:18","Psalm 27"],"collect":"Almighty God, strengthen me to obey You even when obedience is difficult, trusting that Your promises never fail. Amen.","verse":"Exodus 6:7","cc":[{"t":"Catholic","ref":"CCC §§203–231","q":"Why does God reveal His name?"},{"t":"Anglican","ref":"ACNA Q14","q":"Who is God?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q26–28","q":"What comfort comes from God's providence?"},{"t":"Westminster","ref":"Q4","q":"What is God?"},{"t":"Baptist","ref":"Q9","q":"Who is God?"}],"christ":"God delivers His people not merely from slavery but into covenant fellowship, fulfilled perfectly in Christ.","comp":"Every tradition affirms that God's faithfulness is not measured by immediate success but by His covenant promises.","observe":"Why did Pharaoh resist?","interpret":"Why does obedience sometimes increase hardship?","apply":"Will I remain faithful when life becomes harder?","pray":"Pray for steadfast faith under trial.","why":"Introduces the conflict between God's kingdom and earthly powers.","notes":"Pharaoh was regarded as a divine ruler in Egypt, making Moses' demand a direct challenge to Egyptian religion."},{"m":2,"d":2,"name":"The First Plagues","theme":"God's Power Over False Gods","desc":"God demonstrates His supremacy through the first plagues, exposing the helplessness of Egypt's gods and Pharaoh's pride.","cat":"Scripture Study","tl":"Exodus","primary":"Exodus 7–8","supp":["Romans 1:18–25","Psalm 115","Revelation 15:3–4"],"collect":"Lord God, help me worship You alone and reject every idol that competes for my heart.","verse":"Exodus 7:17","cc":[{"t":"Catholic","ref":"CCC §§2112–2114","q":"What is idolatry?"},{"t":"Anglican","ref":"ACNA Q98","q":"Why worship God alone?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this require?"},{"t":"Heidelberg","ref":"Q94","q":"What does God command in the First Commandment?"},{"t":"Westminster","ref":"Q46","q":"What is the First Commandment?"},{"t":"Baptist","ref":"Q50","q":"What does the First Commandment teach?"}],"christ":"The plagues reveal Christ's ultimate victory over every false power and spiritual enemy.","comp":"All traditions reject idolatry and affirm God's absolute sovereignty.","observe":"What do the plagues reveal about God?","interpret":"Why target Egypt's gods?","apply":"What idols compete for my devotion?","pray":"Pray for wholehearted worship.","why":"Begins God's judgment on Egypt's false religion.","notes":"Many plagues directly confronted deities worshiped throughout Egypt."},{"m":2,"d":3,"name":"The Hard Heart","theme":"Judgment and Mercy","desc":"Pharaoh repeatedly refuses to repent despite God's warnings. Scripture reveals both God's justice and His patience toward hardened hearts.","cat":"Doctrine","tl":"Exodus","primary":"Exodus 9–10","supp":["Romans 9:14–24","Hebrews 3:12–15","Psalm 95"],"collect":"Merciful Father, soften my heart that I may gladly obey Your voice.","verse":"Hebrews 3:15","cc":[{"t":"Catholic","ref":"CCC §§1730–1748","q":"What is human freedom?"},{"t":"Anglican","ref":"ACNA Q74–79","q":"What is sin?"},{"t":"Lutheran","ref":"First Commandment","q":"What does stubbornness produce?"},{"t":"Heidelberg","ref":"Q5–8","q":"Why can't we save ourselves?"},{"t":"Westminster","ref":"Q13–19","q":"What happened after the Fall?"},{"t":"Baptist","ref":"Q25–29","q":"Why do people reject God?"}],"christ":"Christ calls sinners to repentance before judgment comes.","comp":"Every tradition teaches that persistent unbelief hardens the heart against God.","observe":"How did Pharaoh respond to God's warnings?","interpret":"What does a hardened heart look like?","apply":"Am I ignoring God's conviction?","pray":"Ask God for a humble and teachable spirit.","why":"Contrasts repentance with rebellion.","notes":"Pharaoh's hardness becomes a lasting biblical warning against unbelief."},{"m":2,"d":4,"name":"The Passover Lamb","theme":"Salvation Through Sacrifice","desc":"God institutes the Passover, sparing Israel through the blood of the lamb and establishing a perpetual remembrance of His saving work.","cat":"Covenant","tl":"Exodus","primary":"Exodus 11–12","supp":["John 1:29","1 Corinthians 5:7","Isaiah 53"],"collect":"Lord Jesus, thank You for becoming the Lamb of God who takes away the sin of the world.","verse":"Exodus 12:13","cc":[{"t":"Catholic","ref":"CCC §§608–618","q":"Why did Christ become the Paschal Lamb?"},{"t":"Anglican","ref":"ACNA Q112","q":"How does Christ save us?"},{"t":"Lutheran","ref":"Apostles' Creed—Second Article","q":"What has Christ done for us?"},{"t":"Heidelberg","ref":"Q37","q":"Why is Christ called our Savior?"},{"t":"Westminster","ref":"Q21","q":"Who is the Redeemer?"},{"t":"Baptist","ref":"Q44","q":"Why did Christ die?"}],"christ":"Jesus is the true Passover Lamb whose blood delivers believers from eternal judgment.","comp":"Every Christian tradition recognizes the Passover as one of Scripture's clearest foreshadowings of Christ.","observe":"Why did the blood save Israel?","interpret":"What does the Passover teach about salvation?","apply":"How should Christ's sacrifice shape my life?","pray":"Thank Christ for His redeeming blood.","why":"One of the Bible's greatest pictures of the Gospel.","notes":"The Passover remains central to Jewish remembrance and Christian understanding of Christ's sacrifice."},{"m":2,"d":5,"name":"Through the Sea","theme":"Deliverance","desc":"God parts the Red Sea, rescuing Israel while defeating Pharaoh's army. Salvation comes entirely through God's power.","cat":"Scripture Study","tl":"Exodus","primary":"Exodus 13–14","supp":["1 Corinthians 10:1–4","Psalm 77","Isaiah 43:1–3"],"collect":"Almighty God, help me trust You when no way forward seems possible.","verse":"Exodus 14:14","cc":[{"t":"Catholic","ref":"CCC §§1213–1222","q":"How does Baptism unite us with Christ?"},{"t":"Anglican","ref":"ACNA Q121–126","q":"What is Baptism?"},{"t":"Lutheran","ref":"Baptism","q":"What blessings does Baptism give?"},{"t":"Heidelberg","ref":"Q69–74","q":"What does Baptism signify?"},{"t":"Westminster","ref":"Q94–95","q":"What is Baptism?"},{"t":"Baptist","ref":"Q92–97","q":"Why did Christ command Baptism?"}],"christ":"Passing safely through the sea points toward Baptism and the believer's deliverance through Christ.","comp":"Traditions differ on Baptism but agree it proclaims God's saving work.","observe":"How did God save Israel?","interpret":"Why didn't Israel save itself?","apply":"Where do I need to trust God's power?","pray":"Thank God for His salvation.","why":"Marks Israel's definitive deliverance from slavery.","notes":"The Red Sea crossing became Israel's defining act of redemption throughout the Old Testament."},{"m":2,"d":6,"name":"The Song of Moses","theme":"Worship After Deliverance","desc":"Israel responds to God's mighty salvation with songs of praise, thanksgiving, and worship.","cat":"Worship","tl":"Exodus","primary":"Exodus 15","supp":["Revelation 15:2–4","Psalm 98","Colossians 3:16"],"collect":"Lord, fill my heart with joyful praise for Your mighty works.","verse":"Exodus 15:2","cc":[{"t":"Catholic","ref":"CCC §§2639–2643","q":"Why do Christians give thanks?"},{"t":"Anglican","ref":"ACNA Q141","q":"Why should Christians worship?"},{"t":"Lutheran","ref":"First Article","q":"How do we thank God?"},{"t":"Heidelberg","ref":"Q86","q":"Why should believers do good works?"},{"t":"Westminster","ref":"Q91","q":"What is our duty to God?"},{"t":"Baptist","ref":"Q90","q":"What is the Christian life?"}],"christ":"The redeemed Church joins Moses' song with the song of the Lamb in Revelation.","comp":"Praise naturally follows God's saving work in every Christian tradition.","observe":"What prompted Israel's worship?","interpret":"Why is gratitude important?","apply":"How can I praise God more faithfully?","pray":"Offer thanksgiving for God's faithfulness.","why":"Salvation leads naturally into worship.","notes":"Moses' song is one of the oldest hymns preserved in Scripture."},{"m":2,"d":7,"name":"Bread from Heaven","theme":"God's Daily Provision","desc":"God provides manna in the wilderness, teaching Israel to depend upon Him each day for every need.","cat":"Christian Living","tl":"Wilderness","primary":"Exodus 16","supp":["John 6:32–35","Matthew 6:11","Psalm 78"],"collect":"Heavenly Father, teach me to depend upon You daily for both physical and spiritual nourishment.","verse":"Exodus 16:4","cc":[{"t":"Catholic","ref":"CCC §§2835–2837","q":"What does \"Give us this day our daily bread\" mean?"},{"t":"Anglican","ref":"ACNA Q145","q":"What do we pray for in the Fourth Petition?"},{"t":"Lutheran","ref":"Lord's Prayer","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q125","q":"What does the Fourth Petition teach?"},{"t":"Westminster","ref":"Q104","q":"What do we pray for?"},{"t":"Baptist","ref":"Q109","q":"What is meant by daily bread?"}],"christ":"Jesus declares Himself to be the true Bread of Life, surpassing the manna given in the wilderness.","comp":"All traditions recognize God's continual provision and Christ as the ultimate spiritual nourishment.","observe":"Why did God provide manna daily?","interpret":"What lesson was Israel meant to learn?","apply":"Do I trust God with today's needs?","pray":"Pray for contentment and dependence upon God.","why":"Introduces God's provision during Israel's wilderness journey.","notes":"Manna became one of Scripture's enduring symbols of God's faithful provision and was later fulfilled in Christ's teaching in John 6."},{"m":2,"d":8,"name":"Water from the Rock","theme":"God Our Provider","desc":"God miraculously provides water for His thirsty people, demonstrating His faithfulness despite Israel's complaints.","cat":"Scripture Study","tl":"Wilderness","primary":"Exodus 17","supp":["1 Corinthians 10:1–4","John 4:13–14","Psalm 95"],"collect":"Gracious Father, satisfy my deepest thirst through Christ, the Living Water.","verse":"Exodus 17:6","cc":[{"t":"Catholic","ref":"CCC §§694, 728","q":"What does water symbolize in salvation?"},{"t":"Anglican","ref":"ACNA Q121","q":"What does Baptism signify?"},{"t":"Lutheran","ref":"Baptism","q":"What blessings does Baptism give?"},{"t":"Heidelberg","ref":"Q69–74","q":"What does Baptism teach?"},{"t":"Westminster","ref":"Q94–95","q":"What is Baptism?"},{"t":"Baptist","ref":"Q92–97","q":"Why is Baptism important?"}],"christ":"Paul identifies the rock as a picture of Christ, from whom living water flows.","comp":"Every tradition sees God as the source of life and recognizes Christ as the fulfillment of this miracle.","observe":"Why did Israel complain?","interpret":"Why did God still provide?","apply":"Do I trust God in difficult seasons?","pray":"Thank God for His faithful provision.","why":"Demonstrates God's grace despite Israel's lack of faith.","notes":"Water was essential for survival in the Sinai wilderness, making this miracle especially significant."},{"m":2,"d":9,"name":"Wisdom in Leadership","theme":"Sharing the Burden","desc":"Moses accepts Jethro's counsel and appoints leaders, showing that wise leadership requires humility and shared responsibility.","cat":"Christian Living","tl":"Wilderness","primary":"Exodus 18","supp":["Acts 6:1–7","Proverbs 11:14","James 1:5"],"collect":"Lord, grant me wisdom to lead and humility to receive godly counsel.","verse":"Proverbs 11:14","cc":[{"t":"Catholic","ref":"CCC §§871–873","q":"How does God use different gifts within His people?"},{"t":"Anglican","ref":"ACNA Q169","q":"Why does the Church need leaders?"},{"t":"Lutheran","ref":"Fourth Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q104","q":"What does God require concerning authority?"},{"t":"Westminster","ref":"Q124","q":"What does the Fifth Commandment teach?"},{"t":"Baptist","ref":"Q66","q":"What authority has God established?"}],"christ":"Christ appoints leaders to serve His Church rather than rule over it selfishly.","comp":"All traditions affirm servant leadership and shared responsibility within God's people.","observe":"Why did Moses accept advice?","interpret":"Why is humility important in leadership?","apply":"Am I willing to learn from others?","pray":"Pray for wisdom and humility.","why":"Prepares Israel for becoming a covenant nation.","notes":"Ancient Near Eastern rulers often governed through appointed officials, though Israel's leadership remained accountable to God."},{"m":2,"d":10,"name":"At Mount Sinai","theme":"A Holy Nation","desc":"Israel arrives at Mount Sinai, where God calls His people into covenant and prepares them to receive His Law.","cat":"Covenant","tl":"Sinai","primary":"Exodus 19","supp":["1 Peter 2:9–10","Hebrews 12:18–24","Psalm 99"],"collect":"Holy God, prepare my heart to hear and obey Your Word.","verse":"Exodus 19:5","cc":[{"t":"Catholic","ref":"CCC §§2052–2055","q":"Why did God give His Law?"},{"t":"Anglican","ref":"ACNA Q46–48","q":"Why does God make covenants?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q93","q":"Why did God give the Law?"},{"t":"Westminster","ref":"Q39","q":"Why was the moral law given?"},{"t":"Baptist","ref":"Q44","q":"Why does God give His commandments?"}],"christ":"Sinai prepares God's people for the New Covenant established by Christ.","comp":"Every tradition views God's Law as revealing His holiness and human need for grace.","observe":"Why did God call Israel holy?","interpret":"What does covenant require?","apply":"How can I honor God's holiness?","pray":"Pray for an obedient heart.","why":"Introduces the giving of the Law.","notes":"Mount Sinai became one of the defining locations in Israel's history."},{"m":2,"d":11,"name":"The Ten Commandments","theme":"Loving God and Neighbor","desc":"God gives the Ten Commandments as the moral foundation for His covenant people.","cat":"Doctrine","tl":"Sinai","primary":"Exodus 20:1–17","supp":["Matthew 22:34–40","Romans 13:8–10","Psalm 19"],"collect":"Lord, write Your commandments upon my heart through the power of Your Spirit.","verse":"Exodus 20:3","cc":[{"t":"Catholic","ref":"CCC §§2052–2557","q":"What are the Ten Commandments?"},{"t":"Anglican","ref":"ACNA Q298–348","q":"What do the Commandments teach?"},{"t":"Lutheran","ref":"Ten Commandments","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q92–115","q":"What is God's Law?"},{"t":"Westminster","ref":"Q39–81","q":"What does the moral law require?"},{"t":"Baptist","ref":"Q44–82","q":"What does God command?"}],"christ":"Jesus perfectly fulfills the Law and teaches its deepest meaning.","comp":"All Christian traditions recognize the Ten Commandments as foundational to Christian ethics.","observe":"Why did God give these commands?","interpret":"What do they reveal about God?","apply":"Which command challenges me most?","pray":"Pray for strength to obey God.","why":"Establishes the moral foundation of biblical faith.","notes":"The Ten Commandments have shaped both religious and civil law throughout history."},{"m":2,"d":12,"name":"Justice and Mercy","theme":"Living as God's People","desc":"God gives laws that teach justice, compassion, honesty, and mercy within His covenant community.","cat":"Christian Living","tl":"Sinai","primary":"Exodus 20:18–23:33","supp":["Micah 6:8","Matthew 5:17–20","Psalm 15"],"collect":"Lord, help me love justice, show mercy, and walk humbly before You.","verse":"Micah 6:8","cc":[{"t":"Catholic","ref":"CCC §§1807–1832","q":"What are the cardinal virtues?"},{"t":"Anglican","ref":"ACNA Q104","q":"How should Christians live?"},{"t":"Lutheran","ref":"Ten Commandments","q":"Christian life"},{"t":"Heidelberg","ref":"Q86","q":"Why should believers do good works?"},{"t":"Westminster","ref":"Q91","q":"What good works please God?"},{"t":"Baptist","ref":"Q90","q":"How should Christians live?"}],"christ":"Christ fulfills the Law while calling believers to lives marked by justice and mercy.","comp":"Every tradition teaches that faith produces lives characterized by love and righteousness.","observe":"Why did God give civil laws?","interpret":"How does justice reflect God's character?","apply":"How can I show mercy today?","pray":"Ask God to make you more like Christ.","why":"Demonstrates that God's Law extends beyond worship into daily life.","notes":"Israel's laws were distinctive among ancient nations for protecting the vulnerable."},{"m":2,"d":13,"name":"Covenant Confirmed","theme":"A Covenant Ratified","desc":"Israel formally accepts God's covenant, and Moses sprinkles the people with covenant blood.","cat":"Covenant","tl":"Sinai","primary":"Exodus 24","supp":["Hebrews 9:11–22","Matthew 26:26–28","Psalm 50"],"collect":"Covenant Lord, thank You for making me part of Your people through Christ.","verse":"Exodus 24:8","cc":[{"t":"Catholic","ref":"CCC §§613–614","q":"Why is Christ's blood the New Covenant?"},{"t":"Anglican","ref":"ACNA Q112","q":"What did Christ accomplish?"},{"t":"Lutheran","ref":"Sacrament of the Altar","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q66","q":"What are the sacraments?"},{"t":"Westminster","ref":"Q75","q":"Why did Christ institute the Lord's Supper?"},{"t":"Baptist","ref":"Q94","q":"What does Communion proclaim?"}],"christ":"Moses' covenant blood points directly to Christ's blood poured out for the forgiveness of sins.","comp":"Every Christian tradition connects Exodus 24 with Christ's institution of the New Covenant.","observe":"Why was blood necessary?","interpret":"What makes a covenant binding?","apply":"What does Christ's covenant mean to me?","pray":"Thank Christ for His sacrifice.","why":"Bridges the Old and New Covenants.","notes":"Jesus intentionally echoes Exodus 24 at the Last Supper."},{"m":2,"d":14,"name":"God's Dwelling Place","theme":"The Tabernacle","desc":"God commands Israel to build the Tabernacle so His presence may dwell among His people.","cat":"Worship","tl":"Sinai","primary":"Exodus 25–27","supp":["John 1:14","Hebrews 8:1–6","Psalm 84"],"collect":"Lord, thank You for dwelling among Your people through Christ and Your Holy Spirit.","verse":"Exodus 25:8","cc":[{"t":"Catholic","ref":"CCC §§756–757","q":"What is God's dwelling among His people?"},{"t":"Anglican","ref":"ACNA Q97","q":"What is the Church?"},{"t":"Lutheran","ref":"Third Article","q":"What does the Holy Spirit do?"},{"t":"Heidelberg","ref":"Q54","q":"What do you believe concerning the holy catholic Church?"},{"t":"Westminster","ref":"Q54","q":"What is the visible Church?"},{"t":"Baptist","ref":"Q95","q":"What is the Church?"}],"christ":"The Tabernacle foreshadows Christ, who \"tabernacled\" among us and makes believers His dwelling through the Holy Spirit.","comp":"Every tradition sees the Tabernacle as anticipating God's presence fulfilled in Christ and His Church.","observe":"Why did God desire a Tabernacle?","interpret":"What does God's presence teach us?","apply":"How should I live as God's dwelling place?","pray":"Praise God for His nearness.","why":"Begins the instructions for Israel's worship.","notes":"The Tabernacle became the center of Israel's worship until the Temple was built centuries later."},{"m":2,"d":15,"name":"The Priesthood","theme":"Mediators Before God","desc":"God appoints Aaron and his sons to serve as priests, setting them apart to minister before Him on behalf of His people.","cat":"Worship","tl":"Sinai","primary":"Exodus 28–29","supp":["Hebrews 4:14–16","1 Peter 2:9","Psalm 110"],"collect":"Lord Jesus, thank You for being my Great High Priest who continually intercedes for me. Amen.","verse":"Hebrews 4:14","cc":[{"t":"Catholic","ref":"CCC §§1536–1600","q":"Why did God establish the priesthood?"},{"t":"Anglican","ref":"ACNA Q113","q":"What is Christ's priestly ministry?"},{"t":"Lutheran","ref":"Apostles' Creed—Second Article","q":"What has Christ done for us?"},{"t":"Heidelberg","ref":"Q31","q":"Why is Christ our only Mediator?"},{"t":"Westminster","ref":"Q25","q":"How does Christ execute the office of a priest?"},{"t":"Baptist","ref":"Q30","q":"Why is Christ our Priest?"}],"christ":"Jesus fulfills the Old Testament priesthood by becoming the eternal High Priest.","comp":"All traditions affirm Christ as the ultimate High Priest while differing on the role of ordained ministry.","observe":"Why were priests necessary?","interpret":"Why does humanity need a mediator?","apply":"How does Christ intercede for me today?","pray":"Thank Christ for His continual intercession.","why":"Introduces the sacrificial ministry before the Tabernacle begins functioning.","notes":"Aaron's priesthood points forward to the perfect and eternal priesthood of Christ described in Hebrews."},{"m":2,"d":16,"name":"Holy Worship","theme":"Approaching God","desc":"God gives detailed instructions for worship, emphasizing that He is holy and worthy of reverence.","cat":"Worship","tl":"Sinai","primary":"Exodus 30–31","supp":["John 4:23–24","Hebrews 12:28–29","Psalm 96"],"collect":"Holy God, teach me to worship You with reverence, joy, and sincerity.","verse":"Psalm 96:9","cc":[{"t":"Catholic","ref":"CCC §§2095–2097","q":"What is true worship?"},{"t":"Anglican","ref":"ACNA Q144","q":"Why do Christians gather for worship?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q94","q":"What does God require in worship?"},{"t":"Westminster","ref":"Q108","q":"What does the Second Commandment teach?"},{"t":"Baptist","ref":"Q55","q":"How should God be worshiped?"}],"christ":"Christ makes true worship possible through His sacrifice and the Holy Spirit.","comp":"Every Christian tradition affirms that worship belongs to God alone.","observe":"Why does God care how He is worshiped?","interpret":"What makes worship acceptable?","apply":"How can I worship God more faithfully?","pray":"Ask God for a heart devoted to Him.","why":"Concludes the Tabernacle instructions before Israel's rebellion.","notes":"Israel's worship centered on God's presence rather than personal preference."},{"m":2,"d":17,"name":"The Golden Calf","theme":"Idolatry and Rebellion","desc":"While Moses remains on Sinai, Israel turns to idolatry, revealing the persistent tendency of the human heart to abandon God.","cat":"Scripture Study","tl":"Sinai","primary":"Exodus 32","supp":["Romans 1:21–25","1 John 5:21","Psalm 106"],"collect":"Merciful Father, guard my heart from every form of idolatry.","verse":"Exodus 32:8","cc":[{"t":"Catholic","ref":"CCC §§2112–2114","q":"What is idolatry?"},{"t":"Anglican","ref":"ACNA Q74","q":"Why is idolatry sinful?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q95","q":"What does God forbid?"},{"t":"Westminster","ref":"Q47","q":"What is forbidden in the First Commandment?"},{"t":"Baptist","ref":"Q51","q":"Why must we worship God alone?"}],"christ":"Christ remained perfectly faithful where Israel repeatedly failed.","comp":"Every Christian tradition warns against idolatry in both visible and invisible forms.","observe":"Why did Israel make the calf?","interpret":"What makes idolatry so destructive?","apply":"What idols compete for my loyalty?","pray":"Pray for an undivided heart.","why":"Demonstrates Israel's failure immediately after receiving God's covenant.","notes":"The golden calf likely reflected Egyptian religious influence and violated the covenant almost immediately."},{"m":2,"d":18,"name":"Moses the Intercessor","theme":"Mercy Through Mediation","desc":"Moses pleads for Israel after their rebellion, foreshadowing Christ's perfect intercession for sinners.","cat":"Prayer","tl":"Sinai","primary":"Exodus 33","supp":["Romans 8:34","Hebrews 7:25","Psalm 130"],"collect":"Lord Jesus, thank You for continually interceding for Your people before the Father.","verse":"Exodus 33:14","cc":[{"t":"Catholic","ref":"CCC §§2574–2577","q":"Why is Moses an example of prayer?"},{"t":"Anglican","ref":"ACNA Q141","q":"Why should Christians pray?"},{"t":"Lutheran","ref":"Lord's Prayer","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q116","q":"Why must Christians pray?"},{"t":"Westminster","ref":"Q98","q":"Why is prayer necessary?"},{"t":"Baptist","ref":"Q108","q":"Why should believers pray?"}],"christ":"Moses' mediation points directly to Christ, who forever intercedes for His Church.","comp":"Every Christian tradition recognizes Christ as humanity's perfect Mediator before God.","observe":"Why did Moses pray?","interpret":"Why does God invite intercession?","apply":"For whom should I pray today?","pray":"Pray for others before yourself.","why":"Highlights God's mercy despite Israel's rebellion.","notes":"Moses becomes one of Scripture's greatest examples of intercessory prayer."},{"m":2,"d":19,"name":"The Glory of the Lord","theme":"Knowing God's Character","desc":"God reveals His glory and proclaims His holy character to Moses, emphasizing both justice and mercy.","cat":"Doctrine","tl":"Sinai","primary":"Exodus 34","supp":["John 1:14–18","2 Corinthians 3:18","Psalm 103"],"collect":"Almighty God, reveal Your glory to me through Your Son and transform me into His likeness.","verse":"Exodus 34:6","cc":[{"t":"Catholic","ref":"CCC §§199–231","q":"Who is God?"},{"t":"Anglican","ref":"ACNA Q14","q":"What is God like?"},{"t":"Lutheran","ref":"First Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q26","q":"What do you believe about God the Father?"},{"t":"Westminster","ref":"Q4","q":"What is God?"},{"t":"Baptist","ref":"Q9","q":"What are God's attributes?"}],"christ":"Jesus perfectly reveals the Father's glory and character.","comp":"Every Christian tradition confesses God's perfect holiness, justice, mercy, and love.","observe":"What attributes does God proclaim?","interpret":"Why is God's character important?","apply":"Which attribute encourages me most?","pray":"Praise God for who He is.","why":"God reveals Himself before renewing the covenant.","notes":"Exodus 34:6–7 became one of the most frequently quoted descriptions of God in the Old Testament."},{"m":2,"d":20,"name":"Building the Tabernacle","theme":"Obedient Service","desc":"Israel willingly gives and labors together to build the Tabernacle according to God's instructions.","cat":"Christian Living","tl":"Sinai","primary":"Exodus 35–39","supp":["Colossians 3:23–24","1 Corinthians 12:4–11","Psalm 90"],"collect":"Lord, use my gifts to build up Your people and glorify Your name.","verse":"Exodus 35:21","cc":[{"t":"Catholic","ref":"CCC §§798–801","q":"Why does God give spiritual gifts?"},{"t":"Anglican","ref":"ACNA Q53","q":"How does the Holy Spirit equip believers?"},{"t":"Lutheran","ref":"Third Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q55","q":"How do believers serve Christ?"},{"t":"Westminster","ref":"Q65","q":"What gifts does Christ give His Church?"},{"t":"Baptist","ref":"Q56","q":"Why does God give gifts?"}],"christ":"The Church is now God's dwelling place, built together through Christ by the Holy Spirit.","comp":"Every tradition teaches that believers should use their gifts in service to God and neighbor.","observe":"Why did the people give willingly?","interpret":"What gifts has God entrusted to His people?","apply":"How can I better serve Christ's Church?","pray":"Offer your abilities to God.","why":"Demonstrates joyful obedience after repentance.","notes":"Skilled craftsmen like Bezalel and Oholiab are remembered as examples of God-given vocation."},{"m":2,"d":21,"name":"God's Glory Fills the Tabernacle","theme":"God's Presence","desc":"After the Tabernacle is completed, God's glory fills it, showing that He dwells among His covenant people.","cat":"Worship","tl":"Sinai","primary":"Exodus 40","supp":["John 1:14","Revelation 21:3","Psalm 84"],"collect":"Lord, thank You for dwelling among Your people through Christ and the Holy Spirit.","verse":"Exodus 40:34","cc":[{"t":"Catholic","ref":"CCC §§756–757","q":"What is the Church as God's dwelling?"},{"t":"Anglican","ref":"ACNA Q97","q":"What is the Church?"},{"t":"Lutheran","ref":"Third Article","q":"What does the Holy Spirit do?"},{"t":"Heidelberg","ref":"Q54","q":"What do you believe concerning the Church?"},{"t":"Westminster","ref":"Q54","q":"What is the visible Church?"},{"t":"Baptist","ref":"Q95","q":"What is the Church?"}],"christ":"The Tabernacle anticipates Christ dwelling among humanity and the New Jerusalem where God will dwell with His people forever.","comp":"Every Christian tradition sees God's desire to dwell with His people fulfilled ultimately in Christ.","observe":"Why did God's glory fill the Tabernacle?","interpret":"What does God's presence mean for believers?","apply":"How can I honor God's presence in my life?","pray":"Thank God for dwelling with His people.","why":"Concludes the Book of Exodus and prepares for Leviticus.","notes":"The cloud over the Tabernacle symbolized God's continual guidance throughout Israel's wilderness journey."},{"m":2,"d":22,"name":"Holy Offerings","theme":"Worship Through Sacrifice","desc":"God establishes the burnt, grain, peace, sin, and guilt offerings, teaching that worship involves devotion, thanksgiving, repentance, and reconciliation.","cat":"Worship","tl":"Leviticus","primary":"Leviticus 1–3","supp":["Hebrews 10:1–10","Romans 12:1","Psalm 51"],"collect":"Holy God, receive my life as a living sacrifice through Jesus Christ. Amen.","verse":"Romans 12:1","cc":[{"t":"Catholic","ref":"CCC §§2099–2100","q":"What is sacrifice?"},{"t":"Anglican","ref":"ACNA Q144","q":"What is Christian worship?"},{"t":"Lutheran","ref":"First Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q32","q":"Why was sacrifice necessary?"},{"t":"Westminster","ref":"Q95","q":"What is worship?"},{"t":"Baptist","ref":"Q57","q":"How should we worship God?"}],"christ":"Every Old Testament sacrifice points toward Christ's once-for-all sacrifice on the Cross.","comp":"Every tradition teaches that Christ fulfilled the sacrificial system, though they explain the Eucharist differently.","observe":"Why did God require sacrifices?","interpret":"What did each offering teach?","apply":"How can I offer myself to God today?","pray":"Thank Christ for His perfect sacrifice.","why":"Introduces Leviticus by showing how sinful people approach a holy God.","notes":"The sacrificial system emphasized both God's holiness and His desire for reconciliation."},{"m":2,"d":23,"name":"A Holy People","theme":"Cleansing from Sin","desc":"God provides sacrifices for sin and guilt, showing both His justice and His desire to forgive those who repent.","cat":"Doctrine","tl":"Leviticus","primary":"Leviticus 4–7","supp":["1 John 1:8–9","Hebrews 9:22","Psalm 32"],"collect":"Merciful Father, cleanse me from sin through the blood of Christ.","verse":"1 John 1:9","cc":[{"t":"Catholic","ref":"CCC §§1846–1848","q":"Why do we need forgiveness?"},{"t":"Anglican","ref":"ACNA Q127","q":"What is repentance?"},{"t":"Lutheran","ref":"Confession","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q56","q":"What is forgiveness?"},{"t":"Westminster","ref":"Q88","q":"What is repentance?"},{"t":"Baptist","ref":"Q87","q":"Why must we repent?"}],"christ":"Christ fulfills every sacrifice for sin by offering Himself once for all.","comp":"All traditions affirm forgiveness comes through Christ's atoning work.","observe":"Why distinguish different sacrifices?","interpret":"What does forgiveness cost?","apply":"Do I confess my sins honestly?","pray":"Thank God for His mercy.","why":"Continues the sacrificial system before the priesthood begins.","notes":"The guilt offering highlighted both forgiveness and restitution."},{"m":2,"d":24,"name":"Consecrated Service","theme":"The Priests Begin Their Ministry","desc":"Aaron and his sons are ordained and begin serving before the Lord according to His commands.","cat":"Worship","tl":"Leviticus","primary":"Leviticus 8–10","supp":["Hebrews 5:1–10","1 Peter 2:9","Psalm 24"],"collect":"Lord Jesus, thank You for making Your people a royal priesthood.","verse":"Leviticus 9:24","cc":[{"t":"Catholic","ref":"CCC §§1536–1600","q":"Why were priests ordained?"},{"t":"Anglican","ref":"ACNA Q113","q":"What is Christ's priesthood?"},{"t":"Lutheran","ref":"Apostles' Creed","q":"What has Christ done?"},{"t":"Heidelberg","ref":"Q31","q":"Why is Christ our Priest?"},{"t":"Westminster","ref":"Q25","q":"How does Christ execute His priestly office?"},{"t":"Baptist","ref":"Q30","q":"Why is Christ the perfect Priest?"}],"christ":"Christ is both Priest and Sacrifice, accomplishing what Aaron's priesthood could never fully achieve.","comp":"All traditions affirm Christ's eternal priesthood while differing regarding ordained ministry.","observe":"Why were the priests consecrated?","interpret":"Why does holiness matter in worship?","apply":"How can I honor God in my service?","pray":"Pray for faithful ministers and churches.","why":"Establishes Israel's priestly ministry.","notes":"Nadab and Abihu's judgment emphasizes reverence before God."},{"m":2,"d":25,"name":"Holy Living","theme":"Clean and Unclean","desc":"God teaches Israel to distinguish between what is holy and what is common, reminding His people that holiness affects every area of life.","cat":"Christian Living","tl":"Leviticus","primary":"Leviticus 11–15","supp":["1 Peter 1:13–16","Mark 7:14–23","Psalm 119"],"collect":"Holy Father, make me holy in heart, word, and deed.","verse":"Leviticus 11:44","cc":[{"t":"Catholic","ref":"CCC §§1691–1698","q":"What is the Christian vocation?"},{"t":"Anglican","ref":"ACNA Q104","q":"How should Christians live?"},{"t":"Lutheran","ref":"Ten Commandments","q":"Christian life"},{"t":"Heidelberg","ref":"Q86","q":"Why do good works?"},{"t":"Westminster","ref":"Q91","q":"What is sanctification?"},{"t":"Baptist","ref":"Q90","q":"How should believers live?"}],"christ":"Christ fulfills the ceremonial laws while calling believers to true holiness of heart.","comp":"Every Christian tradition teaches that holiness flows from God's grace.","observe":"Why distinguish clean from unclean?","interpret":"What is true holiness?","apply":"What areas of my life need greater holiness?","pray":"Pray for purity in thought and action.","why":"Shifts from ceremonial purity to the principle of holy living.","notes":"Jesus later explains that true defilement comes from the heart."},{"m":2,"d":26,"name":"The Day of Atonement","theme":"Cleansing and Reconciliation","desc":"On Israel's holiest day, the High Priest enters the Most Holy Place to make atonement for the sins of the people.","cat":"Doctrine","tl":"Leviticus","primary":"Leviticus 16","supp":["Hebrews 9:11–14","Hebrews 10:11–18","Psalm 103"],"collect":"Merciful Savior, thank You for securing eternal redemption through Your blood.","verse":"Leviticus 16:30","cc":[{"t":"Catholic","ref":"CCC §§615–618","q":"Why did Christ offer Himself?"},{"t":"Anglican","ref":"ACNA Q112","q":"How does Christ save us?"},{"t":"Lutheran","ref":"Apostles' Creed","q":"What has Christ done?"},{"t":"Heidelberg","ref":"Q37","q":"Why is Christ our only sacrifice?"},{"t":"Westminster","ref":"Q44","q":"How does Christ redeem us?"},{"t":"Baptist","ref":"Q44","q":"Why did Christ die?"}],"christ":"Jesus fulfills the Day of Atonement by entering the heavenly sanctuary once for all.","comp":"All Christian traditions recognize the Day of Atonement as a profound foreshadowing of Christ's sacrifice.","observe":"Why was atonement necessary?","interpret":"What does the High Priest symbolize?","apply":"How should Christ's sacrifice change me?","pray":"Praise Christ for complete forgiveness.","why":"One of the clearest Old Testament pictures of the Gospel.","notes":"Hebrews builds much of its theology around Leviticus 16."},{"m":2,"d":27,"name":"Be Holy","theme":"God's Call to His People","desc":"God commands His people to reflect His holiness in worship, relationships, justice, and daily life.","cat":"Christian Living","tl":"Leviticus","primary":"Leviticus 17–20","supp":["Matthew 5:48","1 Peter 1:15–16","Psalm 15"],"collect":"Holy God, shape my life according to Your character.","verse":"Leviticus 19:2","cc":[{"t":"Catholic","ref":"CCC §§1691–1698","q":"What does holiness mean?"},{"t":"Anglican","ref":"ACNA Q104","q":"What is sanctification?"},{"t":"Lutheran","ref":"Ten Commandments","q":"Christian life"},{"t":"Heidelberg","ref":"Q86","q":"Why should believers do good works?"},{"t":"Westminster","ref":"Q91","q":"What is our duty?"},{"t":"Baptist","ref":"Q90","q":"How should Christians live?"}],"christ":"Christ empowers believers to pursue holiness through the Holy Spirit.","comp":"Every Christian tradition teaches that believers are called to holy living by God's grace.","observe":"Why is holiness central to God's people?","interpret":"What does it mean to imitate God?","apply":"Where is God calling me to greater obedience?","pray":"Ask God to make you more like Christ.","why":"Concludes the first major section of Leviticus.","notes":"Leviticus 19 is one of the most frequently quoted chapters in the New Testament."},{"m":2,"d":28,"name":"The Feasts of the Lord","theme":"Remembering God's Salvation","desc":"God establishes sacred festivals that continually remind Israel of His saving acts and covenant faithfulness.","cat":"Worship","tl":"Leviticus","primary":"Leviticus 23","supp":["Luke 22:14–20","Colossians 2:16–17","Psalm 81"],"collect":"Lord, help me remember Your mighty works and rejoice in Your salvation.","verse":"Leviticus 23:2","cc":[{"t":"Catholic","ref":"CCC §§1163–1173","q":"Why does the Church observe holy days?"},{"t":"Anglican","ref":"ACNA Q142","q":"Why do Christians gather throughout the year?"},{"t":"Lutheran","ref":"Third Commandment","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q103","q":"What does the Sabbath teach?"},{"t":"Westminster","ref":"Q58","q":"What does the Fourth Commandment require?"},{"t":"Baptist","ref":"Q62","q":"Why gather for worship?"}],"christ":"The biblical feasts ultimately find their fulfillment in Christ's life, death, resurrection, and promised return.","comp":"Christian traditions observe the Church Year differently, yet all remember Christ's saving work.","observe":"Why did God establish annual feasts?","interpret":"What does remembering accomplish?","apply":"How can I better remember God's faithfulness?","pray":"Thank God for His mighty works throughout history.","why":"Concludes February by preparing for Israel's continued wilderness journey.","notes":"Passover, Firstfruits, and Pentecost all receive explicit fulfillment in the New Testament."},{"m":3,"d":1,"name":"Counted by God","theme":"Every Person Matters","desc":"God commands Moses to count Israel, demonstrating that every member of His covenant people is known, valued, and called to serve.","cat":"Scripture Study","tl":"Wilderness Wanderings","primary":"Numbers 1","supp":["Psalm 139:1–18","John 10:1–18","Ephesians 2:10"],"collect":"Almighty God, thank You for knowing me by name and calling me into Your service. Help me faithfully fulfill the work You have prepared for me through Jesus Christ. Amen.","verse":"Numbers 1:2","cc":[{"t":"Catholic","ref":"CCC §§781–786","q":"What is the People of God?"},{"t":"Anglican","ref":"ACNA Q97–100","q":"What is the Church?"},{"t":"Lutheran","ref":"Third Article","q":"What does this mean?"},{"t":"Heidelberg","ref":"Q54","q":"What do you believe concerning the holy catholic Church?"},{"t":"Westminster","ref":"Q65","q":"What is the visible Church?"},{"t":"Baptist","ref":"Q95","q":"What is the Church?"}],"christ":"Just as Israel was counted for God's purposes, Christ calls each believer individually into His body.","comp":"All traditions affirm that every believer belongs to God's people and has gifts to use in His service.","observe":"Why did God count the people?","interpret":"What does this teach about God's concern for individuals?","apply":"How can I use my gifts in Christ's Church?","pray":"Thank God for calling you by name.","why":"Begins Israel's preparation for the wilderness journey.","notes":"Ancient censuses in Israel primarily prepared men for military and community service under God's covenant."},{"m":3,"d":2,"name":"God at the Center","theme":"Ordered Around God's Presence","desc":"Israel camps around the Tabernacle, reminding the nation that every aspect of life cente
